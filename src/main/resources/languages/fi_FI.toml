# Wormholes — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/Wormholes/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /wormholes language server edit fi_FI
#
# === Etuliite ===
# Viestien etuliitteet kuuluvat viestipohjiin. {prefix} tarkoittaa portaalin tuontikoodin alkua.
#
# === Muotoilu ===
# Värikoodit: &0-&f; muotoilu: &k-&r (&l = lihavointi, &r = nollaus). Säilytä paikkamerkit muuttumattomina vain niitä käyttävissä viesteissä.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {access}  Portaalin pääsykäytäntö
#   {address}  Verkon vertaisosoite
#   {after}  Viestin arvo muokkauksen jälkeen
#   {allocation}  Taskutilan varaus
#   {amount}  Matkan rahahinta Vault-valuutassa
#   {argument}  Odottamaton komentoargumentti
#   {before}  Viestin arvo ennen muokkausta
#   {biome}  Biomin tunniste
#   {blacklisted}  Estetyt pelaajat
#   {block}  Valittu lohkomateriaali
#   {blocks}  Uudelleenrakennukseen kuuluvat asetetut lohkot
#   {cancel}  Chat-syötteen peruutussana
#   {code}  Palvelimen tai portaalin kutsukoodi
#   {color}  Valittu näyttöväri
#   {command}  Komentopolku
#   {containers}  Uudelleenrakennukseen kuuluvat säiliöt, joissa on sisältöä
#   {cost}  Portaalin luonti- tai matkakustannus
#   {count}  Portaalien, kohteiden tai viestien määrä
#   {degrees}  Kuvan kierto asteina
#   {depth}  Heijastuksen syvyys
#   {description}  Viestin kuvaus
#   {destination}  Matkan kohde
#   {detail}  Diagnostiikan lisätiedot
#   {diagnostic}  Diagnostiikkaviesti
#   {direction}  Matkan tai katselun suunta
#   {door}  Taskutilan uloskäyntiovi
#   {duration}  Pelaajakohtainen päivitysväli
#   {endpoint}  Madonreiän päätepisteen tunniste
#   {entities}  Kohde-entiteettien määrä tai niiden päivitysväli tickeinä
#   {entity}  Entiteettien päivitysväli tickeinä
#   {error}  Viimeisimmän toiminnon virhe
#   {facing}  Portaalin suunta
#   {failed}  Epäonnistuneiden toimintojen määrä
#   {fallback}  Vaihtoehtoinen matkatulos
#   {fingerprint}  Julkisen avaimen sormenjälki
#   {free}  Vapaiden satunnaiskohdepaikkojen määrä
#   {grace}  Heijastuksen lisäaika sekunteina
#   {group}  Kielieditorin luokka
#   {id}  Kohteen tunniste
#   {incoming}  Saapuvan matkustuksen käytäntö
#   {item}  Matkaan vaadittu esine
#   {key}  Viestin tai asetuksen avain
#   {kind}  Oven pääsytyyppi
#   {label}  Näyttöteksti
#   {large_step}  Säätömäärä vaihtonäppäin pohjassa napsautettaessa
#   {line}  Rivinumero viestissä
#   {locale}  Kielitunnus
#   {material}  Taskutilan seinämateriaali
#   {maximum}  Suurin sallittu arvo
#   {message}  Palauteviesti
#   {minimum}  Pienin sallittu arvo
#   {mode}  Matka- tai näyttötila
#   {name}  Portaalin tai pelaajan nimi
#   {next}  Seuraava käytettävissä oleva vaihtoehto
#   {node}  Verkkosolmun tunniste
#   {none}  Teksti puuttuvalle linkitetylle kohteelle
#   {other}  Linkitetyn päätepisteen tunniste
#   {outgoing}  Lähtevän matkustuksen käytäntö
#   {owner}  Portaalin omistaja
#   {page}  Nykyinen sivunumero
#   {pages}  Sivujen kokonaismäärä
#   {parameter}  Komennon parametrin nimi
#   {path}  Tiedoston tai hakemiston polku
#   {personal}  Henkilökohtainen kielitunnus
#   {plugin}  Lisäosan nimi
#   {portal}  Portaalin nimi tai tunniste
#   {prefix}  Portaalin tuontikoodin alku
#   {previous}  Taskutilan edellinen koko lohkoina
#   {quality}  Heijastusvirran laatu
#   {quantity}  Vaadittujen esineiden määrä
#   {range}  Portaalin aktivointietäisyys lohkoina
#   {readiness}  Satunnaiskohteen valmiustila
#   {reason}  Virheen tai päätöksen syy
#   {receive}  Heijastuksen vastaanottotila
#   {refresh}  Heijastuksen päivitysväli tickeinä
#   {reserved}  Varattujen satunnaiskohdepaikkojen määrä
#   {resized}  Uudelleenrakennettujen taskutilojen määrä
#   {rotation}  Heijastuksen kierto
#   {route}  Yritetty matkareitti
#   {rtt}  Verkon edestakainen viive
#   {seconds}  Aika sekunteina
#   {send}  Heijastuksen lähetystila
#   {server}  Palvelimen nimi tai tunniste
#   {size}  Taskutilan koko lohkoina
#   {skin}  Portaalin valittu ulkoasu
#   {skipped}  Ohitettujen toimintojen määrä
#   {space}  Taskutilan tunniste
#   {state}  Nykyinen pääsy-, linkki- tai verkkotila
#   {step}  Säätömäärä napsautettaessa
#   {style}  Näyttötyyli
#   {target}  Kielivalinnan vastaanottava lisäosa
#   {type}  Kohteen tai parametrin tyyppi
#   {up}  Heijastuksen yläreunan suunta
#   {usage}  Komennon syntaksi
#   {value}  Nykyinen tai valittu arvo
#   {variables}  Viestin sallitut paikkamerkit
#   {whitelisted}  Sallitut pelaajat
#   {world}  Maailman nimi
#   {x}  X-koordinaatti
#   {y}  Y-koordinaatti
#   {z}  Z-koordinaatti

