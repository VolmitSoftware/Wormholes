[command]
public_help = ["&8[&6Wormholes&8] &7ポータルのヘルプ: &f/wormholes info", "&8[&6Wormholes&8] &7ポータルにポータルワンドを使うと、目的地、表示、移動、アクセス設定を開けます。"]
info = ["&8[&6Wormholes&8] &7&lワームホールの作り方&r", "&81. &7サーバーまたは管理者からポータルワンドとポータルルーンを入手します。", "&82. &7同じ平面上に、ルーンを任意のつながった形で配置します。", "&7   長方形、直線 (3x1)、単一ブロック、L 字形、十字形など、つながった形なら使用できます。", "&7   ルーンは、座標軸に沿った 1 枚の壁、床、または天井上に平らに配置してください。", "&83. &7ポータルワンドを持ち、&f任意のルーンブロックを左クリック&7してポータルを形成します。", "&84. &7別の場所に 2 つ目のポータルを作ります(距離とワールドは問いません)。", "&85. &7開いたポータルをワンドでクリックし、メインメニューを開きます。", "&7   &f目的地&7を選び、もう一方のポータルを指定します。反対側でも同じ操作を行います。", "&7   向きとアクセス設定は、それぞれ専用の簡単なメニューにまとまっています。", "&86. &7どちらかのポータルから {range} ブロック以内に立つと、目的地のワールドがフレーム内に投影され、入るとテレポートします。", "&7管理者は &f/wormholes wand でアイテムを作成できます"]

