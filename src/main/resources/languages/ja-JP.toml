# Wormholes — ja-JP
#
# === ファイルの編集 ===
# plugins/Wormholes/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /wormholes language server edit ja-JP
#
# === 接頭辞 ===
# メッセージの接頭辞は各テンプレート内にあり、メッセージごとに編集します。{prefix} はポータルのインポートコードの先頭部分です。
#
# === 書式 ===
# 色コード: &0-&f。書式コード: &k-&r（&l = 太字、&r = リセット）。変数名は変更せず、対応するメッセージ内でのみ使用してください。
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {access}  ポータルのアクセス方針
#   {address}  ネットワーク接続先のアドレス
#   {after}  編集後のメッセージ値
#   {allocation}  ポケット空間の割り当て
#   {amount}  Vault通貨での移動料金
#   {argument}  予期しないコマンド引数
#   {before}  編集前のメッセージ値
#   {biome}  バイオームの識別子
#   {blacklisted}  拒否するプレイヤー
#   {block}  選択したブロック素材
#   {blocks}  再構築の影響を受ける設置済みブロック数
#   {cancel}  チャット入力を取り消す語
#   {code}  サーバーまたはポータル招待コード
#   {color}  選択した表示色
#   {command}  コマンドのパス
#   {containers}  再構築の影響を受ける中身のある容器数
#   {cost}  ポータル作成または移動の料金
#   {count}  ポータル、行き先、またはメッセージ数
#   {degrees}  投影画像の回転角度
#   {depth}  投影の奥行き
#   {description}  メッセージの説明
#   {destination}  移動先
#   {detail}  追加の診断詳細
#   {diagnostic}  診断メッセージ
#   {direction}  移動方向または向き
#   {door}  ポケットの出口ドア
#   {duration}  プレイヤーごとの更新間隔
#   {endpoint}  ワームホール端点の識別子
#   {entities}  影響を受けるエンティティ数、または更新間隔（ティック）
#   {entity}  エンティティの更新間隔（ティック）
#   {error}  直前の操作のエラー
#   {facing}  ポータルの向き
#   {failed}  失敗した操作数
#   {fallback}  代替の移動結果
#   {fingerprint}  公開鍵のフィンガープリント
#   {free}  空いているランダム行き先の枠数
#   {grace}  投影の猶予時間（秒）
#   {group}  言語エディターの分類
#   {id}  オブジェクトの識別子
#   {incoming}  入ってくる移動の方針
#   {item}  移動に必要なアイテム
#   {key}  メッセージまたは設定のキー
#   {kind}  ドアのアクセス種類
#   {label}  表示ラベル
#   {large_step}  Shiftクリック時の変更幅
#   {line}  メッセージ内の行番号
#   {locale}  言語コード
#   {material}  ポケットの壁素材
#   {maximum}  許容最大値
#   {message}  応答または診断のメッセージ
#   {minimum}  許容最小値
#   {mode}  選択した操作または表示モード
#   {name}  ポータル名またはプレイヤー名
#   {next}  次に選べる項目
#   {node}  ネットワークノードの識別子
#   {none}  行き先が未接続であることを示すラベル
#   {other}  接続した端点の識別子
#   {outgoing}  出ていく移動の方針
#   {owner}  ポータルの所有者
#   {page}  現在のページ番号
#   {pages}  総ページ数
#   {parameter}  コマンドパラメーター名
#   {path}  ファイルまたはフォルダーのパス
#   {personal}  個人の言語コード
#   {plugin}  プラグイン名
#   {portal}  ポータル名または識別子
#   {prefix}  ポータルのインポートコードの先頭部分
#   {previous}  以前のポケットサイズ（ブロック）
#   {quality}  投影ストリームの品質
#   {quantity}  必要なアイテム数
#   {range}  ポータルの有効化距離（ブロック）
#   {readiness}  ランダム行き先の準備状態
#   {reason}  エラーまたは判断の理由
#   {receive}  投影の受信状態
#   {refresh}  投影の更新間隔（ティック）
#   {reserved}  予約済みランダム行き先の枠数
#   {resized}  再構築したポケット数
#   {rotation}  投影の回転
#   {route}  試行した移動経路
#   {rtt}  ネットワークの往復遅延
#   {seconds}  時間（秒）
#   {send}  投影の送信状態
#   {server}  サーバー名または識別子
#   {size}  ポケットサイズ（ブロック）
#   {skin}  選択したポータルスキン
#   {skipped}  スキップした操作数
#   {space}  ポケット空間の識別子
#   {state}  現在のアクセス、接続、またはネットワークの状態
#   {step}  クリック時の変更幅
#   {style}  表示スタイル
#   {target}  言語選択を適用するプラグイン
#   {type}  オブジェクトまたはパラメーターの種類
#   {up}  投影の上側となる方向
#   {usage}  コマンド構文
#   {value}  現在または選択中の値
#   {variables}  メッセージで使用可能な変数
#   {whitelisted}  許可するプレイヤー
#   {world}  ワールド名
#   {x}  X座標
#   {y}  Y座標
#   {z}  Z座標

