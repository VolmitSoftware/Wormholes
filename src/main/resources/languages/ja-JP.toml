"command.info" = ["<dark_gray>[<gold>Wormholes<dark_gray>] <gray><bold>ワームホールの作り方</bold>","<dark_gray>1. <gray>サーバーまたは管理者からポータルワンドとポータルルーンを入手します。","<dark_gray>2. <gray>同じ平面上に、ルーンを任意のつながった形で配置します。","<gray>   長方形、直線 (3x1)、単一ブロック、L 字形、十字形など、つながった形なら使用できます。","<gray>   ルーンは、座標軸に沿った 1 枚の壁、床、または天井上に平らに配置してください。","<dark_gray>3. <gray>ポータルワンドを持ち、<white>任意のルーンブロックを左クリック<gray>してポータルを形成します。","<dark_gray>4. <gray>別の場所に 2 つ目のポータルを作ります(距離とワールドは問いません)。","<dark_gray>5. <gray>開いたポータルをワンドでクリックし、メインメニューを開きます。","<gray>   <white>目的地<gray>を選び、もう一方のポータルを指定します。反対側でも同じ操作を行います。","<gray>   向きとアクセス設定は、それぞれ専用の簡単なメニューにまとまっています。","<dark_gray>6. <gray>どちらかのポータルから {range} ブロック以内に立つと、目的地のワールドがフレーム内に投影され、入るとテレポートします。","<gray>管理者は <white>/wormholes wand でアイテムを作成できます"]
