[command]
unknown = "Lệnh không xác định. Vui lòng dùng /wormholes để xem trợ giúp."
public_help = ["&8[&6Wormholes&8] &7Trợ giúp cổng dịch chuyển: &f/wormholes info", "&8[&6Wormholes&8] &7Dùng gậy cổng dịch chuyển lên cổng để mở các tùy chọn điểm đến, khung nhìn, di chuyển và truy cập."]
info = ["&8[&6Wormholes&8] &7&lCách xây lỗ sâu&r", "&81. &7Nhận gậy cổng dịch chuyển và rune lỗ sâu từ máy chủ hoặc quản trị viên.", "&82. &7Đặt rune thành một hình nối liền trên cùng bề mặt phẳng.", "&7   Mọi hình nối liền đều dùng được: hình chữ nhật, đường thẳng (3x1), một khối, hình chữ L và hình chữ thập.", "&7   Rune phải nằm phẳng trên cùng một mặt tường, sàn hoặc trần thẳng theo trục tọa độ.", "&83. &7Cầm gậy cổng dịch chuyển và &fnhấp trái vào khối rune bất kỳ&7 để tạo cổng.", "&84. &7Xây cổng thứ hai ở nơi khác (không giới hạn khoảng cách hoặc thế giới).", "&85. &7Mở trình đơn cổng bằng gậy khi đang nhìn vào cổng, hoặc ngồi xuống với tay chính trống rồi nhấp phải vào một khối cổng (chủ sở hữu hoặc quản trị viên).", "&7   Chọn &fĐiểm đến&7 rồi chọn cổng còn lại. Lặp lại ở phía bên kia.", "&7   Hướng và quyền truy cập nằm trong các trình đơn riêng, đơn giản.", "&86. &7Đứng trong phạm vi {range} khối của một trong hai cổng (phạm vi kích hoạt toàn cục hiện tại); thế giới đích sẽ chiếu qua khung và bạn sẽ dịch chuyển khi bước vào.", "&7Quản trị viên có thể tạo vật phẩm bằng &f/wormholes wand"]

