# Wormholes — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/Wormholes/languages/vi_VI.toml
# Bạn có thể sửa trực tiếp tệp này. Các thay đổi cục bộ được giữ lại; mục bị thiếu, trống hoặc không hợp lệ sẽ dùng các ngôn ngữ dự phòng, sau đó là tiếng Anh.
# /wormholes language server edit vi_VI
#
# === Tiền tố ===
# Tiền tố thông báo nằm trong từng mẫu và được sửa riêng ở mỗi thông báo. {prefix} là phần đầu mã nhập cổng.
#
# === Định dạng ===
# Mã màu: &0-&f; định dạng: &k-&r (&l = in đậm, &r = đặt lại). Giữ nguyên tên biến và chỉ dùng trong thông báo tương ứng.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {access}  Chính sách truy cập cổng
#   {added}  Thông báo được thêm bởi bản cập nhật ngôn ngữ
#   {address}  Địa chỉ nút mạng đối tác
#   {after}  Giá trị thông báo sau khi sửa
#   {allocation}  Phân bổ không gian túi
#   {amount}  Phí di chuyển bằng tiền
#   {argument}  Đối số lệnh không mong đợi
#   {before}  Giá trị thông báo trước khi sửa
#   {biome}  Mã định danh quần xã
#   {blacklisted}  Người chơi bị chặn
#   {block}  Vật liệu khối đã chọn
#   {blocks}  Số khối đã đặt bị ảnh hưởng khi xây lại
#   {cancel}  Từ để hủy nhập trong khung chat
#   {cells}  Số ô mở của lỗ mở
#   {code}  Mã máy chủ hoặc lời mời cổng
#   {color}  Màu hiển thị đã chọn
#   {command}  Đường dẫn lệnh
#   {containers}  Số vật chứa không rỗng bị ảnh hưởng khi xây lại
#   {cost}  Phí tạo cổng hoặc di chuyển
#   {count}  Số cổng, điểm đến hoặc thông báo
#   {degrees}  Góc xoay hình ảnh tính bằng độ
#   {depth}  Độ sâu hình chiếu
#   {description}  Mô tả thông báo
#   {destination}  Điểm đến di chuyển
#   {detail}  Chi tiết chẩn đoán bổ sung
#   {diagnostic}  Thông báo chẩn đoán
#   {direction}  Hướng di chuyển hoặc hướng nhìn
#   {door}  Cửa thoát không gian túi
#   {duration}  Chu kỳ cập nhật riêng của người chơi
#   {endpoint}  Mã định danh điểm cuối lỗ sâu
#   {entities}  Số thực thể bị ảnh hưởng hoặc chu kỳ cập nhật thực thể theo tick
#   {entity}  Chu kỳ cập nhật thực thể theo tick
#   {error}  Lỗi của thao tác gần nhất
#   {facing}  Hướng của cổng
#   {failed}  Số thao tác thất bại
#   {fallback}  Kết quả di chuyển thay thế
#   {fingerprint}  Dấu vân tay khóa công khai
#   {free}  Số chỗ điểm đến ngẫu nhiên còn trống
#   {grace}  Thời gian duy trì hình chiếu tính bằng giây
#   {group}  Danh mục của trình sửa ngôn ngữ
#   {id}  Mã định danh đối tượng
#   {incoming}  Chính sách di chuyển vào
#   {item}  Vật phẩm cần để di chuyển
#   {kept}  Chỉnh sửa cục bộ được giữ lại sau bản cập nhật ngôn ngữ
#   {key}  Khóa thông báo hoặc cấu hình
#   {kind}  Loại truy cập cửa
#   {label}  Nhãn hiển thị
#   {large_step}  Mức điều chỉnh khi nhấp cùng Shift
#   {line}  Số dòng trong thông báo
#   {locale}  Mã ngôn ngữ
#   {material}  Vật liệu tường không gian túi
#   {maximum}  Giá trị tối đa cho phép
#   {message}  Thông báo phản hồi hoặc chẩn đoán
#   {minimum}  Giá trị tối thiểu cho phép
#   {mode}  Chế độ thao tác hoặc hiển thị đã chọn
#   {name}  Tên cổng hoặc người chơi
#   {next}  Tùy chọn khả dụng tiếp theo
#   {node}  Mã định danh nút mạng
#   {none}  Nhãn cho trạng thái chưa liên kết điểm đến
#   {other}  Mã định danh điểm cuối đã liên kết
#   {outgoing}  Chính sách di chuyển ra
#   {owner}  Chủ sở hữu cổng
#   {page}  Số trang hiện tại
#   {pages}  Tổng số trang
#   {parameter}  Tên tham số lệnh
#   {path}  Đường dẫn tệp hoặc thư mục
#   {personal}  Mã ngôn ngữ cá nhân
#   {plugin}  Tên plugin
#   {portal}  Tên hoặc mã định danh cổng
#   {prefix}  Phần đầu mã nhập cổng
#   {previous}  Kích thước không gian túi trước đó theo khối
#   {quality}  Chất lượng luồng hình chiếu
#   {quantity}  Số vật phẩm cần thiết
#   {range}  Phạm vi kích hoạt cổng theo khối
#   {readiness}  Trạng thái sẵn sàng của điểm đến ngẫu nhiên
#   {reason}  Lý do lỗi hoặc quyết định
#   {receive}  Trạng thái nhận hình chiếu
#   {refresh}  Chu kỳ làm mới hình chiếu theo tick
#   {remaining}  Thời gian còn lại đến lần kiểm tra ngôn ngữ tiếp theo
#   {reserved}  Số chỗ điểm đến ngẫu nhiên đã giữ
#   {resized}  Số không gian túi đã xây lại
#   {rotation}  Độ xoay hình chiếu
#   {route}  Tuyến di chuyển đã thử
#   {rtt}  Độ trễ khứ hồi mạng
#   {seconds}  Thời gian tính bằng giây
#   {section}  Mục trong trình chỉnh sửa ngôn ngữ
#   {send}  Trạng thái gửi hình chiếu
#   {server}  Tên hoặc mã định danh máy chủ
#   {shape}  Hình dạng lỗ mở của cổng
#   {size}  Kích thước không gian túi theo khối
#   {skin}  Diện mạo cổng đã chọn
#   {skipped}  Số thao tác đã bỏ qua
#   {space}  Mã định danh không gian túi
#   {state}  Trạng thái truy cập, liên kết hoặc mạng hiện tại
#   {step}  Mức điều chỉnh khi nhấp
#   {style}  Kiểu hiển thị
#   {target}  Plugin nhận lựa chọn ngôn ngữ
#   {type}  Loại đối tượng hoặc tham số
#   {up}  Hướng ở phía trên hình chiếu
#   {updated}  Thông báo được thay đổi bởi bản cập nhật ngôn ngữ
#   {value}  Giá trị hiện tại hoặc đã chọn
#   {variables}  Các biến được phép dùng trong thông báo
#   {whitelisted}  Người chơi được phép
#   {world}  Tên thế giới
#   {x}  Tọa độ X
#   {y}  Tọa độ Y
#   {z}  Tọa độ Z

