[command]
public_help = ["&8[&6Wormholes&8] &7傳送門幫助：&f/wormholes info", "&8[&6Wormholes&8] &7對傳送門使用傳送門法杖，可開啟目的地、檢視、通行和存取控制。"]
info = ["&8[&6Wormholes&8] &7&l如何建造蟲洞&r", "&81. &7從伺服器或管理員處獲得傳送門法杖和傳送門符文。", "&82. &7在同一平面上將符文擺成任意相連形狀。", "&7   任意相連形狀都可以：矩形、直線 (3x1)、單個方塊、L 形和十字形。", "&7   符文必須平整地位於同一面與座標軸對齊的牆、地板或天花板上。", "&83. &7手持傳送門法杖，&f左鍵點擊任意符文方塊&7以建立傳送門。", "&84. &7在其他位置建造第二個傳送門(距離和世界不限)。", "&85. &7手持法杖點擊已開啟的傳送門，開啟主選單。", "&7   選擇&f目的地&7並選中另一個傳送門，然後在另一端重複此操作。", "&7   方向和存取控制分別位於各自的簡潔選單中。", "&86. &7站在任一傳送門 {range} 個方塊內，目的地世界會投影在框架中；走入框架即可傳送。", "&7管理員可使用 &f/wormholes wand 建立物品"]

