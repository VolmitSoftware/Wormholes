# Wormholes — zh_TW
#
# === 編輯檔案 ===
# plugins/Wormholes/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /wormholes language server edit zh_TW
#
# === 前綴 ===
# 訊息前綴位於各自範本中，請逐條編輯。{prefix} 是傳送門匯入代碼的開頭。
#
# === 格式 ===
# 顏色代碼：&0-&f；格式代碼：&k-&r（&l = 粗體，&r = 重設）。請保留變數名稱，並僅在對應訊息中使用。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {access}  傳送門存取原則
#   {address}  網路對端位址
#   {after}  編輯後的訊息值
#   {allocation}  口袋空間配置
#   {amount}  Vault 貨幣傳送費用
#   {argument}  非預期的指令引數
#   {before}  編輯前的訊息值
#   {biome}  生態域識別碼
#   {blacklisted}  遭封鎖的玩家
#   {block}  所選方塊材質
#   {blocks}  重建影響的已放置方塊數量
#   {cancel}  取消聊天輸入的詞語
#   {code}  伺服器或傳送門邀請碼
#   {color}  所選顯示顏色
#   {command}  指令路徑
#   {containers}  重建影響的非空容器數量
#   {cost}  傳送門建立或傳送費用
#   {count}  傳送門、目的地或訊息數量
#   {degrees}  影像旋轉角度
#   {depth}  投影深度
#   {description}  訊息說明
#   {destination}  傳送目的地
#   {detail}  其他診斷詳細資料
#   {diagnostic}  診斷訊息
#   {direction}  傳送或朝向方向
#   {door}  口袋空間出口門
#   {duration}  玩家專屬更新間隔
#   {endpoint}  蟲洞端點識別碼
#   {entities}  受影響實體數量或實體更新間隔（刻）
#   {entity}  實體更新間隔（刻）
#   {error}  上次操作的錯誤
#   {facing}  傳送門朝向
#   {failed}  失敗的操作數量
#   {fallback}  備用傳送結果
#   {fingerprint}  公開金鑰指紋
#   {free}  可用隨機目的地欄位數量
#   {grace}  投影寬限時間（秒）
#   {group}  語言編輯器類別
#   {id}  物件識別碼
#   {incoming}  傳入傳送原則
#   {item}  傳送所需物品
#   {key}  訊息或設定鍵
#   {kind}  門存取類型
#   {label}  顯示標籤
#   {large_step}  按住 Shift 點擊時的調整量
#   {line}  訊息內的行號
#   {locale}  語言代碼
#   {material}  口袋空間牆壁材質
#   {maximum}  允許的最大值
#   {message}  回饋或診斷訊息
#   {minimum}  允許的最小值
#   {mode}  所選操作或顯示模式
#   {name}  傳送門或玩家名稱
#   {next}  下一個可用選項
#   {node}  網路節點識別碼
#   {none}  未連接目的地的標籤
#   {other}  已連接端點識別碼
#   {outgoing}  傳出傳送原則
#   {owner}  傳送門擁有者
#   {page}  目前頁碼
#   {pages}  總頁數
#   {parameter}  指令參數名稱
#   {path}  檔案或目錄路徑
#   {personal}  個人語言代碼
#   {plugin}  外掛名稱
#   {portal}  傳送門名稱或識別碼
#   {prefix}  傳送門匯入代碼的開頭
#   {previous}  先前的口袋空間大小（方塊）
#   {quality}  投影串流品質
#   {quantity}  所需物品數量
#   {range}  傳送門啟動範圍（方塊）
#   {readiness}  隨機目的地就緒狀態
#   {reason}  錯誤或決定的原因
#   {receive}  投影接收狀態
#   {refresh}  投影更新間隔（刻）
#   {reserved}  已保留隨機目的地欄位數量
#   {resized}  已重建口袋空間數量
#   {rotation}  投影旋轉
#   {route}  嘗試的傳送路線
#   {rtt}  網路往返延遲
#   {seconds}  時間（秒）
#   {send}  投影傳送狀態
#   {server}  伺服器名稱或識別碼
#   {size}  口袋空間大小（方塊）
#   {skin}  所選傳送門外觀
#   {skipped}  已略過操作數量
#   {space}  口袋空間識別碼
#   {state}  目前存取、連接或網路狀態
#   {step}  點擊時的調整量
#   {style}  顯示樣式
#   {target}  套用語言選擇的外掛
#   {type}  物件或參數類型
#   {up}  投影頂部方向
#   {usage}  指令語法
#   {value}  目前或所選值
#   {variables}  訊息允許的預留位置
#   {whitelisted}  允許的玩家
#   {world}  世界名稱
#   {x}  X 座標
#   {y}  Y 座標
#   {z}  Z 座標

