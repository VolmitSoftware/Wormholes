# Wormholes — ko_KR
#
# === 파일 편집 ===
# plugins/Wormholes/languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /wormholes language server edit ko_KR
#
# === 접두사 ===
# 메시지 접두사는 각 템플릿에 있으므로 메시지마다 수정하세요. {prefix}는 포털 가져오기 코드의 시작 부분입니다.
#
# === 서식 ===
# 색상 코드: &0-&f. 서식 코드: &k-&r (&l = 굵게, &r = 초기화). 변수 이름을 유지하고 해당 메시지에서만 사용하세요.
#
# === 변수 ===
# 변수 이름을 변경하지 말고 각 메시지에 원래 있는 변수만 사용하세요.
#   {access}  포털 접근 정책
#   {address}  네트워크 상대 주소
#   {after}  편집 후 메시지 값
#   {allocation}  포켓 공간 할당
#   {amount}  Vault 화폐 이동 비용
#   {argument}  예상하지 못한 명령 인수
#   {before}  편집 전 메시지 값
#   {biome}  생물 군계 식별자
#   {blacklisted}  차단된 플레이어
#   {block}  선택한 블록 재료
#   {blocks}  재건축에 영향을 받는 설치된 블록 수
#   {cancel}  채팅 입력 취소 단어
#   {code}  서버 또는 포털 초대 코드
#   {color}  선택한 표시 색상
#   {command}  명령 경로
#   {containers}  재건축에 영향을 받는 내용물이 있는 용기 수
#   {cost}  포털 생성 또는 이동 비용
#   {count}  포털, 목적지 또는 메시지 수
#   {degrees}  투영 이미지 회전 각도
#   {depth}  투영 깊이
#   {description}  메시지 설명
#   {destination}  이동 목적지
#   {detail}  추가 진단 정보
#   {diagnostic}  진단 메시지
#   {direction}  이동 또는 바라보는 방향
#   {door}  포켓 출구 문
#   {duration}  플레이어별 업데이트 간격
#   {endpoint}  웜홀 끝점 식별자
#   {entities}  영향받는 개체 수 또는 개체 업데이트 간격(틱)
#   {entity}  개체 업데이트 간격(틱)
#   {error}  마지막 작업 오류
#   {facing}  포털이 향하는 방향
#   {failed}  실패한 작업 수
#   {fallback}  대체 이동 결과
#   {fingerprint}  공개 키 지문
#   {free}  사용 가능한 무작위 목적지 슬롯 수
#   {grace}  투영 유예 시간(초)
#   {group}  언어 편집기 분류
#   {id}  객체 식별자
#   {incoming}  들어오는 이동 정책
#   {item}  이동에 필요한 아이템
#   {key}  메시지 또는 설정 키
#   {kind}  문 접근 유형
#   {label}  표시 라벨
#   {large_step}  Shift 클릭 시 조정량
#   {line}  메시지 내 줄 번호
#   {locale}  언어 코드
#   {material}  포켓 벽 재료
#   {maximum}  허용 최댓값
#   {message}  응답 또는 진단 메시지
#   {minimum}  허용 최솟값
#   {mode}  선택한 작업 또는 표시 모드
#   {name}  포털 또는 플레이어 이름
#   {next}  다음 사용 가능한 옵션
#   {node}  네트워크 노드 식별자
#   {none}  연결된 목적지가 없음을 나타내는 라벨
#   {other}  연결된 끝점 식별자
#   {outgoing}  나가는 이동 정책
#   {owner}  포털 소유자
#   {page}  현재 페이지 번호
#   {pages}  전체 페이지 수
#   {parameter}  명령 매개변수 이름
#   {path}  파일 또는 폴더 경로
#   {personal}  개인 언어 코드
#   {plugin}  플러그인 이름
#   {portal}  포털 이름 또는 식별자
#   {prefix}  포털 가져오기 코드의 시작 부분
#   {previous}  이전 포켓 크기(블록)
#   {quality}  투영 스트림 품질
#   {quantity}  필요한 아이템 수
#   {range}  포털 활성화 거리(블록)
#   {readiness}  무작위 목적지 준비 상태
#   {reason}  오류 또는 결정의 이유
#   {receive}  투영 수신 상태
#   {refresh}  투영 갱신 간격(틱)
#   {reserved}  예약된 무작위 목적지 슬롯 수
#   {resized}  재건축한 포켓 수
#   {rotation}  투영 회전
#   {route}  시도한 이동 경로
#   {rtt}  네트워크 왕복 지연 시간
#   {seconds}  시간(초)
#   {send}  투영 송신 상태
#   {server}  서버 이름 또는 식별자
#   {size}  포켓 크기(블록)
#   {skin}  선택한 포털 스킨
#   {skipped}  건너뛴 작업 수
#   {space}  포켓 공간 식별자
#   {state}  현재 접근, 연결 또는 네트워크 상태
#   {step}  클릭 시 조정량
#   {style}  표시 스타일
#   {target}  언어 선택을 적용할 플러그인
#   {type}  객체 또는 매개변수 유형
#   {up}  투영 상단 방향
#   {usage}  명령 구문
#   {value}  현재 또는 선택한 값
#   {variables}  메시지에 허용되는 변수
#   {whitelisted}  허용된 플레이어
#   {world}  월드 이름
#   {x}  X 좌표
#   {y}  Y 좌표
#   {z}  Z 좌표

