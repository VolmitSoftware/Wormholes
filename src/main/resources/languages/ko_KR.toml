[command]
public_help = ["&8[&6Wormholes&8] &7포털 도움말: &f/wormholes info", "&8[&6Wormholes&8] &7포털에 포털 지팡이를 사용하면 목적지, 보기, 이동 및 접근 설정을 열 수 있습니다."]
info = ["&8[&6Wormholes&8] &7&l웜홀 만드는 방법&r", "&81. &7서버 또는 관리자에게서 포털 지팡이와 포털 룬을 받습니다.", "&82. &7한 평면에 룬을 서로 연결된 모양으로 배치합니다.", "&7   직사각형, 직선 (3x1), 단일 블록, L자, 십자 등 연결된 모양이면 됩니다.", "&7   룬은 좌표축에 맞는 하나의 벽, 바닥 또는 천장에 평평하게 놓여야 합니다.", "&83. &7포털 지팡이를 들고 &f아무 룬 블록이나 왼쪽 클릭&7하여 포털을 만듭니다.", "&84. &7다른 위치에 두 번째 포털을 만듭니다(거리와 월드는 무관합니다).", "&85. &7지팡이로 열린 포털을 클릭해 주 메뉴를 엽니다.", "&7   &f목적지&7를 선택하고 다른 포털을 지정합니다. 반대쪽에서도 반복합니다.", "&7   방향과 접근 설정은 각각 별도의 간단한 메뉴에 있습니다.", "&86. &7두 포털 중 하나에서 {range}블록 안에 서면 목적지 월드가 프레임에 투영되며, 안으로 걸어가면 순간이동합니다.", "&7관리자는 &f/wormholes wand 명령으로 아이템을 만들 수 있습니다"]

