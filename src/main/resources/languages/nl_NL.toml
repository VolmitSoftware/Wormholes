# Wormholes — nl_NL
#
# === Bestand bewerken ===
# plugins/Wormholes/languages/nl_NL.toml
# Je kunt dit bestand direct bewerken. Lokale wijzigingen blijven behouden; ontbrekende, lege of ongeldige vermeldingen gebruiken de terugvaltalen en daarna Engels.
# /wormholes language server edit nl_NL
#
# === Voorvoegsel ===
# Berichtvoorvoegsels maken deel uit van hun sjablonen. {prefix} is het begin van een portaalimportcode.
#
# === Opmaak ===
# Kleurcodes: &0-&f; opmaak: &k-&r (&l = vet, &r = reset). Behoud de variabelen en gebruik ze alleen in het bijbehorende bericht.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {access}  Toegangsbeleid van het portaal
#   {address}  Adres van de netwerkpeer
#   {after}  Berichtwaarde na bewerking
#   {allocation}  Toewijzing van de pocketruimte
#   {amount}  Reiskosten in Vault-valuta
#   {argument}  Onverwacht opdrachtargument
#   {before}  Berichtwaarde vóór bewerking
#   {biome}  Bioomidentificatie
#   {blacklisted}  Geblokkeerde spelers
#   {block}  Geselecteerd blokmateriaal
#   {blocks}  Geplaatste blokken die door herbouw worden beïnvloed
#   {cancel}  Annuleringswoord voor chatinvoer
#   {code}  Uitnodigingscode van de server of het portaal
#   {color}  Geselecteerde weergavekleur
#   {command}  Opdrachtpad
#   {containers}  Niet-lege containers die door herbouw worden beïnvloed
#   {cost}  Kosten voor het maken van een portaal of een reis
#   {count}  Aantal portalen, bestemmingen of berichten
#   {degrees}  Beeldrotatie in graden
#   {depth}  Projectiediepte
#   {description}  Berichtbeschrijving
#   {destination}  Reisbestemming
#   {detail}  Aanvullende diagnosegegevens
#   {diagnostic}  Diagnosebericht
#   {direction}  Reis- of kijkrichting
#   {door}  Uitgangsdeur van de pocketruimte
#   {duration}  Spelerspecifiek update-interval
#   {endpoint}  Identificatie van het wormgat-eindpunt
#   {entities}  Aantal betrokken entiteiten of update-interval in ticks
#   {entity}  Update-interval van entiteiten in ticks
#   {error}  Fout van de laatste bewerking
#   {facing}  Kijkrichting van het portaal
#   {failed}  Aantal mislukte bewerkingen
#   {fallback}  Alternatief reisresultaat
#   {fingerprint}  Vingerafdruk van de openbare sleutel
#   {free}  Beschikbare plaatsen voor willekeurige bestemmingen
#   {grace}  Respijtperiode van de projectie in seconden
#   {group}  Categorie van de taaleditor
#   {id}  Objectidentificatie
#   {incoming}  Beleid voor inkomende reizen
#   {item}  Vereist voorwerp voor de reis
#   {key}  Bericht- of configuratiesleutel
#   {kind}  Toegangstype van de deur
#   {label}  Weergegeven label
#   {large_step}  Aanpassingsstap bij Shift-klikken
#   {line}  Regelnummer binnen een bericht
#   {locale}  Taalcode
#   {material}  Wandmateriaal van de pocketruimte
#   {maximum}  Maximaal toegestane waarde
#   {message}  Feedbackbericht
#   {minimum}  Minimaal toegestane waarde
#   {mode}  Reis- of weergavemodus
#   {name}  Naam van het portaal of de speler
#   {next}  Volgende beschikbare optie
#   {node}  Identificatie van het netwerkknooppunt
#   {none}  Label voor het ontbreken van een gekoppelde bestemming
#   {other}  Identificatie van het gekoppelde eindpunt
#   {outgoing}  Beleid voor uitgaande reizen
#   {owner}  Portaaleigenaar
#   {page}  Huidig paginanummer
#   {pages}  Totaal aantal pagina’s
#   {parameter}  Naam van de opdrachtparameter
#   {path}  Bestands- of mappad
#   {personal}  Persoonlijke taalcode
#   {plugin}  Pluginnaam
#   {portal}  Naam of identificatie van het portaal
#   {prefix}  Begin van een portaalimportcode
#   {previous}  Vorige grootte van de pocketruimte in blokken
#   {quality}  Kwaliteit van de projectiestroom
#   {quantity}  Vereist aantal voorwerpen
#   {range}  Activeringsbereik van het portaal in blokken
#   {readiness}  Gereedheidsstatus van willekeurige bestemmingen
#   {reason}  Reden voor een fout of beslissing
#   {receive}  Ontvangststatus van de projectie
#   {refresh}  Verversingsinterval van de projectie in ticks
#   {reserved}  Gereserveerde plaatsen voor willekeurige bestemmingen
#   {resized}  Aantal herbouwde pocketruimtes
#   {rotation}  Rotatie van de projectie
#   {route}  Geprobeerd reistraject
#   {rtt}  Netwerklatentie voor heen- en terugreis
#   {seconds}  Tijd in seconden
#   {section}  Onderdeel van de taaleditor
#   {send}  Verzendstatus van de projectie
#   {server}  Servernaam of -identificatie
#   {size}  Grootte van de pocketruimte in blokken
#   {skin}  Geselecteerd portaaluiterlijk
#   {skipped}  Aantal overgeslagen bewerkingen
#   {space}  Identificatie van de pocketruimte
#   {state}  Huidige toegangs-, koppelings- of netwerkstatus
#   {step}  Aanpassingsstap bij klikken
#   {style}  Weergavestijl
#   {target}  Plugin waarop de taalkeuze wordt toegepast
#   {type}  Object- of parametertype
#   {up}  Richting aan de bovenkant van de projectie
#   {value}  Huidige of geselecteerde waarde
#   {variables}  Toegestane plaatshouders in het bericht
#   {whitelisted}  Toegestane spelers
#   {world}  Wereldnaam
#   {x}  X-coördinaat
#   {y}  Y-coördinaat
#   {z}  Z-coördinaat

