# Wormholes — pt_PT
#
# === Editar o ficheiro ===
# plugins/Wormholes/languages/pt_PT.toml
# Podes editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta, vazias ou inválidas usam os idiomas de recurso e depois o inglês.
# /wormholes language server edit pt_PT
#
# === Prefixo ===
# Os prefixos das mensagens fazem parte dos respetivos modelos. {prefix} indica o início de um código de importação de portal.
#
# === Formatação ===
# Códigos de cor: &0-&f; formatação: &k-&r (&l = negrito, &r = repor). Mantenha os marcadores e use-os apenas nas respetivas mensagens.
#
# === Variáveis ===
# Mantenha os nomes das variáveis e use apenas as que pertencem a cada mensagem.
#   {access}  Política de acesso ao portal
#   {address}  Endereço do par de rede
#   {after}  Valor da mensagem após a edição
#   {allocation}  Alocação do espaço de bolso
#   {amount}  Custo da viagem em moeda Vault
#   {argument}  Argumento de comando inesperado
#   {before}  Valor da mensagem antes da edição
#   {biome}  Identificador do bioma
#   {blacklisted}  Jogadores bloqueados
#   {block}  Material do bloco selecionado
#   {blocks}  Blocos colocados afetados pela reconstrução
#   {cancel}  Palavra para cancelar a entrada na conversa
#   {code}  Código de convite do servidor ou portal
#   {color}  Cor de apresentação selecionada
#   {command}  Caminho do comando
#   {containers}  Recipientes não vazios afetados pela reconstrução
#   {cost}  Custo de criação do portal ou da viagem
#   {count}  Número de portais, destinos ou mensagens
#   {degrees}  Rotação da imagem em graus
#   {depth}  Profundidade da projeção
#   {description}  Descrição da mensagem
#   {destination}  Destino da viagem
#   {detail}  Detalhes de diagnóstico adicionais
#   {diagnostic}  Mensagem de diagnóstico
#   {direction}  Direção da viagem ou orientação
#   {door}  Porta de saída do espaço de bolso
#   {duration}  Intervalo de atualização específico do jogador
#   {endpoint}  Identificador da extremidade do wormhole
#   {entities}  Número de entidades afetadas ou intervalo de atualização em ticks
#   {entity}  Intervalo de atualização das entidades em ticks
#   {error}  Erro da última operação
#   {facing}  Orientação do portal
#   {failed}  Número de operações falhadas
#   {fallback}  Resultado alternativo da viagem
#   {fingerprint}  Impressão digital da chave pública
#   {free}  Vagas disponíveis para destinos aleatórios
#   {grace}  Período de tolerância da projeção em segundos
#   {group}  Categoria do editor de idioma
#   {id}  Identificador do objeto
#   {incoming}  Política de viagens de entrada
#   {item}  Item necessário para a viagem
#   {key}  Chave da mensagem ou da configuração
#   {kind}  Tipo de acesso à porta
#   {label}  Etiqueta apresentada
#   {large_step}  Passo de ajuste ao clicar com Shift
#   {line}  Número da linha na mensagem
#   {locale}  Código do idioma
#   {material}  Material das paredes do espaço de bolso
#   {maximum}  Valor máximo permitido
#   {message}  Mensagem de resposta
#   {minimum}  Valor mínimo permitido
#   {mode}  Modo de viagem ou apresentação
#   {name}  Nome do portal ou jogador
#   {next}  Opção disponível seguinte
#   {node}  Identificador do nó de rede
#   {none}  Etiqueta para ausência de destino ligado
#   {other}  Identificador da extremidade ligada
#   {outgoing}  Política de viagens de saída
#   {owner}  Proprietário do portal
#   {page}  Número da página atual
#   {pages}  Número total de páginas
#   {parameter}  Nome do parâmetro do comando
#   {path}  Caminho do ficheiro ou diretório
#   {personal}  Código do idioma pessoal
#   {plugin}  Nome do plugin
#   {portal}  Nome ou identificador do portal
#   {prefix}  Início de um código de importação de portal
#   {previous}  Tamanho anterior do espaço de bolso em blocos
#   {quality}  Qualidade do fluxo de projeção
#   {quantity}  Quantidade de itens necessária
#   {range}  Alcance de ativação do portal em blocos
#   {readiness}  Estado de prontidão dos destinos aleatórios
#   {reason}  Motivo do erro ou da decisão
#   {receive}  Estado de receção da projeção
#   {refresh}  Intervalo de atualização da projeção em ticks
#   {reserved}  Vagas reservadas para destinos aleatórios
#   {resized}  Número de espaços de bolso reconstruídos
#   {rotation}  Rotação da projeção
#   {route}  Rota de viagem tentada
#   {rtt}  Latência de ida e volta da rede
#   {seconds}  Tempo em segundos
#   {section}  Secção do editor de idiomas
#   {send}  Estado de envio da projeção
#   {server}  Nome ou identificador do servidor
#   {size}  Tamanho do espaço de bolso em blocos
#   {skin}  Aspeto do portal selecionado
#   {skipped}  Número de operações ignoradas
#   {space}  Identificador do espaço de bolso
#   {state}  Estado atual do acesso, ligação ou rede
#   {step}  Passo de ajuste ao clicar
#   {style}  Estilo de apresentação
#   {target}  Plugin que recebe a seleção do idioma
#   {type}  Tipo de objeto ou parâmetro
#   {up}  Direção no topo da projeção
#   {value}  Valor atual ou selecionado
#   {variables}  Variáveis permitidas na mensagem
#   {whitelisted}  Jogadores permitidos
#   {world}  Nome do mundo
#   {x}  Coordenada X
#   {y}  Coordenada Y
#   {z}  Coordenada Z

