# Wormholes — es_ES
#
# === Editar el archivo ===
# plugins/Wormholes/languages/es_ES.toml
# Puedes editar este archivo directamente. Se conservan los cambios locales; las entradas ausentes, vacías o no válidas usan los idiomas de respaldo y después el inglés.
# /wormholes language server edit es_ES
#
# === Prefijo ===
# Los prefijos de mensaje forman parte de cada plantilla. {prefix} indica el inicio de un código de importación de portal.
#
# === Formato ===
# Códigos de color: &0-&f; formato: &k-&r (&l = negrita, &r = restablecer). Conserva los marcadores y úsalos solo en su mensaje correspondiente.
#
# === Variables ===
# Mantenga los nombres de las variables y use solo las que ya contiene cada mensaje.
#   {access}  Regla de acceso al portal
#   {address}  Dirección de red del nodo remoto
#   {after}  Texto del mensaje tras editarlo
#   {allocation}  Espacio asignado al recinto
#   {amount}  Coste del viaje en moneda de Vault
#   {argument}  Argumento de comando inesperado
#   {before}  Texto del mensaje antes de editarlo
#   {biome}  Identificador del bioma
#   {blacklisted}  Jugadores bloqueados
#   {block}  Material del bloque seleccionado
#   {blocks}  Bloques colocados afectados por la reconstrucción
#   {cancel}  Palabra para cancelar la entrada por chat
#   {code}  Código de invitación al servidor o portal
#   {color}  Color de visualización seleccionado
#   {command}  Ruta del comando
#   {containers}  Contenedores no vacíos afectados por la reconstrucción
#   {cost}  Coste de crear el portal o viajar
#   {count}  Cantidad de portales, destinos o mensajes
#   {degrees}  Rotación de la imagen en grados
#   {depth}  Profundidad de la proyección
#   {description}  Descripción del mensaje
#   {destination}  Destino del viaje
#   {detail}  Detalles adicionales del diagnóstico
#   {diagnostic}  Mensaje de diagnóstico
#   {direction}  Dirección de viaje u orientación
#   {door}  Puerta de salida del recinto
#   {duration}  Intervalo de actualización por jugador
#   {endpoint}  Identificador del extremo del agujero de gusano
#   {entities}  Cantidad de entidades afectadas o intervalo de actualización de entidades en ticks
#   {entity}  Intervalo de actualización de entidades en ticks
#   {error}  Error de la última operación
#   {facing}  Orientación del portal
#   {failed}  Cantidad de operaciones fallidas
#   {fallback}  Resultado alternativo del viaje
#   {fingerprint}  Huella de la clave pública
#   {free}  Plazas disponibles para destinos aleatorios
#   {grace}  Periodo de gracia de la proyección en segundos
#   {group}  Categoría del editor de idiomas
#   {id}  Identificador del objeto
#   {incoming}  Regla de viajes entrantes
#   {item}  Objeto necesario para viajar
#   {key}  Clave del mensaje o de configuración
#   {kind}  Tipo de acceso de la puerta
#   {label}  Etiqueta mostrada
#   {large_step}  Cantidad de ajuste al hacer clic con Mayús
#   {line}  Número de línea dentro del mensaje
#   {locale}  Código de idioma
#   {material}  Material de las paredes del recinto
#   {maximum}  Valor máximo permitido
#   {message}  Mensaje de respuesta
#   {minimum}  Valor mínimo permitido
#   {mode}  Modo de viaje o visualización
#   {name}  Nombre del portal o del jugador
#   {next}  Siguiente opción disponible
#   {node}  Identificador del nodo de red
#   {none}  Etiqueta para la ausencia de un destino enlazado
#   {other}  Identificador del extremo enlazado
#   {outgoing}  Regla de viajes salientes
#   {owner}  Propietario del portal
#   {page}  Número de la página actual
#   {pages}  Cantidad total de páginas
#   {parameter}  Nombre del parámetro del comando
#   {path}  Ruta del archivo o directorio
#   {personal}  Código del idioma personal
#   {plugin}  Nombre del complemento
#   {portal}  Nombre o identificador del portal
#   {prefix}  Inicio de un código de importación de portal
#   {previous}  Tamaño anterior del recinto en bloques
#   {quality}  Calidad de la transmisión de la proyección
#   {quantity}  Cantidad de objetos necesaria
#   {range}  Alcance de activación del portal en bloques
#   {readiness}  Estado de disponibilidad de los destinos aleatorios
#   {reason}  Motivo del error o de la decisión
#   {receive}  Estado de recepción de la proyección
#   {refresh}  Intervalo de actualización de la proyección en ticks
#   {reserved}  Plazas reservadas para destinos aleatorios
#   {resized}  Cantidad de recintos reconstruidos
#   {rotation}  Rotación de la proyección
#   {route}  Ruta de viaje intentada
#   {rtt}  Latencia de ida y vuelta en la red
#   {seconds}  Tiempo en segundos
#   {section}  Sección del editor de idiomas
#   {send}  Estado de envío de la proyección
#   {server}  Nombre o identificador del servidor
#   {size}  Tamaño del recinto en bloques
#   {skin}  Apariencia seleccionada del portal
#   {skipped}  Cantidad de operaciones omitidas
#   {space}  Identificador del espacio del recinto
#   {state}  Estado actual del acceso, enlace o red
#   {step}  Cantidad de ajuste al hacer clic
#   {style}  Estilo de visualización
#   {target}  Complemento al que se aplica la selección de idioma
#   {type}  Tipo de objeto o parámetro
#   {up}  Dirección de la parte superior de la proyección
#   {value}  Valor actual o seleccionado
#   {variables}  Variables permitidas en el mensaje
#   {whitelisted}  Jugadores permitidos
#   {world}  Nombre del mundo
#   {x}  Coordenada X
#   {y}  Coordenada Y
#   {z}  Coordenada Z

