# Wormholes — de_DE
#
# === Datei bearbeiten ===
# plugins/Wormholes/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /wormholes language server edit de_DE
#
# === Präfix ===
# Nachrichtenpräfixe sind Teil der jeweiligen Nachrichtenvorlage. {prefix} bezeichnet den Anfang eines Portalimportcodes.
#
# === Formatierung ===
# Farbcodes: &0-&f; Formatierung: &k-&r (&l = fett, &r = zurücksetzen). Platzhalter bleiben unverändert und gelten nur für ihre jeweilige Nachricht.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {access}  Zugriffsregel des Portals
#   {address}  Netzwerkadresse der Gegenstelle
#   {after}  Nachrichtentext nach der Bearbeitung
#   {allocation}  Zugewiesener Taschenraum
#   {amount}  Reisekosten in Vault-Währung
#   {argument}  Unerwartetes Befehlsargument
#   {before}  Nachrichtentext vor der Bearbeitung
#   {biome}  Biomkennung
#   {blacklisted}  Gesperrte Spieler
#   {block}  Ausgewähltes Blockmaterial
#   {blocks}  Vom Neubau betroffene platzierte Blöcke
#   {cancel}  Abbruchwort für die Chateingabe
#   {code}  Einladungscode für Server oder Portal
#   {color}  Ausgewählte Anzeigefarbe
#   {command}  Befehlspfad
#   {containers}  Vom Neubau betroffene gefüllte Behälter
#   {cost}  Kosten der Portalerstellung oder Reise
#   {count}  Anzahl der Portale, Ziele oder Nachrichten
#   {degrees}  Bilddrehung in Grad
#   {depth}  Projektionstiefe
#   {description}  Beschreibung der Nachricht
#   {destination}  Reiseziel
#   {detail}  Zusätzliche Diagnosedetails
#   {diagnostic}  Diagnosenachricht
#   {direction}  Reise- oder Blickrichtung
#   {door}  Ausgangstür des Taschenraums
#   {duration}  Spielerspezifisches Aktualisierungsintervall
#   {endpoint}  Kennung des Wurmloch-Endpunkts
#   {entities}  Anzahl betroffener Entitäten oder deren Aktualisierungsintervall in Ticks
#   {entity}  Aktualisierungsintervall der Entitäten in Ticks
#   {error}  Fehler der letzten Aktion
#   {facing}  Blickrichtung des Portals
#   {failed}  Anzahl fehlgeschlagener Aktionen
#   {fallback}  Alternatives Reiseergebnis
#   {fingerprint}  Fingerabdruck des öffentlichen Schlüssels
#   {free}  Freie Plätze für Zufallsziele
#   {grace}  Nachlaufzeit der Projektion in Sekunden
#   {group}  Kategorie im Spracheditor
#   {id}  Objektkennung
#   {incoming}  Regel für eingehende Reisen
#   {item}  Für die Reise benötigter Gegenstand
#   {key}  Nachrichten- oder Einstellungsschlüssel
#   {kind}  Zugriffstyp der Tür
#   {label}  Anzeigebeschriftung
#   {large_step}  Änderungsschritt bei Umschalt-Klick
#   {line}  Zeilennummer innerhalb einer Nachricht
#   {locale}  Sprachcode
#   {material}  Wandmaterial des Taschenraums
#   {maximum}  Höchster erlaubter Wert
#   {message}  Rückmeldung
#   {minimum}  Niedrigster erlaubter Wert
#   {mode}  Reise- oder Anzeigemodus
#   {name}  Portal- oder Spielername
#   {next}  Nächste verfügbare Option
#   {node}  Kennung des Netzwerkknotens
#   {none}  Beschriftung für ein fehlendes verbundenes Ziel
#   {other}  Kennung des verbundenen Endpunkts
#   {outgoing}  Regel für ausgehende Reisen
#   {owner}  Portalbesitzer
#   {page}  Aktuelle Seitennummer
#   {pages}  Gesamtzahl der Seiten
#   {parameter}  Name des Befehlsparameters
#   {path}  Datei- oder Verzeichnispfad
#   {personal}  Persönlicher Sprachcode
#   {plugin}  Pluginname
#   {portal}  Portalname oder -kennung
#   {prefix}  Anfang eines Portalimportcodes
#   {previous}  Vorherige Taschenraumgröße in Blöcken
#   {quality}  Übertragungsqualität der Projektion
#   {quantity}  Benötigte Anzahl an Gegenständen
#   {range}  Aktivierungsreichweite des Portals in Blöcken
#   {readiness}  Bereitschaftsstatus der Zufallsziele
#   {reason}  Grund eines Fehlers oder einer Entscheidung
#   {receive}  Empfangsstatus der Projektion
#   {refresh}  Aktualisierungsintervall der Projektion in Ticks
#   {reserved}  Reservierte Plätze für Zufallsziele
#   {resized}  Anzahl neu aufgebauter Taschenräume
#   {rotation}  Drehung der Projektion
#   {route}  Versuchte Reiseroute
#   {rtt}  Netzwerklatenz für Hin- und Rückweg
#   {seconds}  Zeit in Sekunden
#   {send}  Sendestatus der Projektion
#   {server}  Servername oder -kennung
#   {size}  Taschenraumgröße in Blöcken
#   {skin}  Ausgewähltes Portaldesign
#   {skipped}  Anzahl übersprungener Aktionen
#   {space}  Kennung des Taschenraums
#   {state}  Aktueller Zugriffs-, Verbindungs- oder Netzwerkstatus
#   {step}  Änderungsschritt beim Klicken
#   {style}  Anzeigestil
#   {target}  Plugin, für das die Sprache gewählt wird
#   {type}  Objekt- oder Parametertyp
#   {up}  Richtung am oberen Rand der Projektion
#   {usage}  Befehlssyntax
#   {value}  Aktueller oder ausgewählter Wert
#   {variables}  Erlaubte Nachrichtenvariablen
#   {whitelisted}  Zugelassene Spieler
#   {world}  Weltname
#   {x}  X-Koordinate
#   {y}  Y-Koordinate
#   {z}  Z-Koordinate

