# Wormholes — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/Wormholes/languages/tr_TR.toml
# Bu dosya doğrudan düzenlenebilir. Yerel değişiklikler korunur; eksik, boş veya geçersiz girdiler önce yedek dilleri, ardından İngilizceyi kullanır.
# /wormholes language server edit tr_TR
#
# === Önek ===
# İleti önekleri ilgili ileti şablonlarının parçasıdır. {prefix}, portal içe aktarma kodunun başlangıcını belirtir.
#
# === Biçimlendirme ===
# Renk kodları: &0-&f; biçimlendirme: &k-&r (&l = kalın, &r = sıfırla). Değişken adlarını koruyun ve yalnızca ilgili mesajlarda kullanın.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca ilgili iletinin değişkenlerini kullanın.
#   {access}  Portal erişim kuralı
#   {address}  Uzak düğümün ağ adresi
#   {after}  Düzenlemeden sonraki ileti değeri
#   {allocation}  Cep alanı tahsisi
#   {amount}  Vault para biriminde yolculuk ücreti
#   {argument}  Beklenmeyen komut argümanı
#   {before}  Düzenlemeden önceki ileti değeri
#   {biome}  Biyom kimliği
#   {blacklisted}  Engellenen oyuncular
#   {block}  Seçilen blok malzemesi
#   {blocks}  Yeniden yapımdan etkilenen yerleştirilmiş bloklar
#   {cancel}  Sohbet girdisini iptal etme sözcüğü
#   {code}  Sunucu veya portal davet kodu
#   {color}  Seçilen görüntüleme rengi
#   {command}  Komut yolu
#   {containers}  Yeniden yapımdan etkilenen dolu kaplar
#   {cost}  Portal oluşturma veya yolculuk ücreti
#   {count}  Portal, hedef veya ileti sayısı
#   {degrees}  Derece cinsinden görüntü dönüşü
#   {depth}  Yansıtma derinliği
#   {description}  İleti açıklaması
#   {destination}  Yolculuk hedefi
#   {detail}  Ek tanılama ayrıntıları
#   {diagnostic}  Tanılama iletisi
#   {direction}  Yolculuk veya bakış yönü
#   {door}  Cep çıkış kapısı
#   {duration}  Oyuncuya özel güncelleme aralığı
#   {endpoint}  Solucan deliği uç noktasının kimliği
#   {entities}  Etkilenen varlık sayısı veya tik cinsinden varlık güncelleme aralığı
#   {entity}  Tik cinsinden varlık güncelleme aralığı
#   {error}  Son işlemin hatası
#   {facing}  Portalın bakış yönü
#   {failed}  Başarısız işlem sayısı
#   {fallback}  Alternatif yolculuk sonucu
#   {fingerprint}  Açık anahtar parmak izi
#   {free}  Rastgele hedefler için kullanılabilir yuvalar
#   {grace}  Saniye cinsinden yansıtma ek süresi
#   {group}  Dil düzenleyicisi kategorisi
#   {id}  Nesne kimliği
#   {incoming}  Gelen yolculuk kuralı
#   {item}  Yolculuk için gereken eşya
#   {key}  İleti veya yapılandırma anahtarı
#   {kind}  Kapı erişim türü
#   {label}  Görüntülenen etiket
#   {large_step}  Shift ile tıklandığında değişim miktarı
#   {line}  İletideki satır numarası
#   {locale}  Dil kodu
#   {material}  Cep duvarlarının malzemesi
#   {maximum}  İzin verilen en yüksek değer
#   {message}  Geri bildirim iletisi
#   {minimum}  İzin verilen en düşük değer
#   {mode}  Yolculuk veya görüntüleme modu
#   {name}  Portal veya oyuncu adı
#   {next}  Sonraki kullanılabilir seçenek
#   {node}  Ağ düğümü kimliği
#   {none}  Bağlı hedef olmadığını belirten etiket
#   {other}  Bağlı uç noktanın kimliği
#   {outgoing}  Giden yolculuk kuralı
#   {owner}  Portal sahibi
#   {page}  Geçerli sayfa numarası
#   {pages}  Toplam sayfa sayısı
#   {parameter}  Komut parametresinin adı
#   {path}  Dosya veya dizin yolu
#   {personal}  Kişisel dil kodu
#   {plugin}  Eklenti adı
#   {portal}  Portal adı veya kimliği
#   {prefix}  Portal içe aktarma kodunun başlangıcı
#   {previous}  Blok cinsinden önceki cep boyutu
#   {quality}  Yansıtma akışının kalitesi
#   {quantity}  Gereken eşya sayısı
#   {range}  Blok cinsinden portal etkinleştirme menzili
#   {readiness}  Rastgele hedeflerin hazırlık durumu
#   {reason}  Hatanın veya kararın nedeni
#   {receive}  Yansıtma alma durumu
#   {refresh}  Tik cinsinden yansıtma yenileme aralığı
#   {reserved}  Rastgele hedefler için ayrılmış yuvalar
#   {resized}  Yeniden yapılan cep sayısı
#   {rotation}  Yansıtma dönüşü
#   {route}  Denenen yolculuk rotası
#   {rtt}  Ağ gidiş dönüş gecikmesi
#   {seconds}  Saniye cinsinden süre
#   {section}  Dil düzenleyicisi bölümü
#   {send}  Yansıtma gönderme durumu
#   {server}  Sunucu adı veya kimliği
#   {size}  Blok cinsinden cep boyutu
#   {skin}  Seçilen portal görünümü
#   {skipped}  Atlanan işlem sayısı
#   {space}  Cep alanı kimliği
#   {state}  Geçerli erişim, bağlantı veya ağ durumu
#   {step}  Tıklandığında değişim miktarı
#   {style}  Görüntüleme stili
#   {target}  Dil seçiminin uygulanacağı eklenti
#   {type}  Nesne veya parametre türü
#   {up}  Yansıtmanın üst tarafındaki yön
#   {value}  Geçerli veya seçilen değer
#   {variables}  İletide izin verilen değişkenler
#   {whitelisted}  İzin verilen oyuncular
#   {world}  Dünya adı
#   {x}  X koordinatı
#   {y}  Y koordinatı
#   {z}  Z koordinatı

