[command]
public_help = ["&8[&6Wormholes&8] &7Справка по порталам: &f/wormholes info", "&8[&6Wormholes&8] &7Используйте жезл портала на портале, чтобы открыть настройки назначения, вида, перемещения и доступа."]
info = ["&8[&6Wormholes&8] &7&lКак построить червоточину&r", "&81. &7Получите жезл портала и руны портала на сервере или у администратора.", "&82. &7Разместите руны в виде любой связанной фигуры на одной плоскости.", "&7   Подойдут прямоугольники, линии (3x1), одиночные блоки, Г-образные фигуры и кресты.", "&7   Руны должны лежать на одной выровненной по осям стене, полу или потолке.", "&83. &7Возьмите жезл портала и &fнажмите левой кнопкой по любой руне&7, чтобы создать портал.", "&84. &7Постройте второй портал в другом месте (на любом расстоянии и в любом мире).", "&85. &7Нажмите жезлом на открытый портал, чтобы открыть главное меню.", "&7   Выберите &fНазначение&7 и укажите другой портал. Повторите с другой стороны.", "&7   Настройки ориентации и доступа находятся в отдельных простых меню.", "&86. &7Встаньте в пределах {range} блоков от любого портала: мир назначения появится в рамке, а вход в неё телепортирует вас.", "&7Администраторы могут создавать предметы командой &f/wormholes wand"]

