# Wormholes — ru_RU
#
# === Редактирование файла ===
# plugins/Wormholes/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /wormholes language server edit ru_RU
#
# === Префикс ===
# Префиксы сообщений находятся в самих шаблонах и изменяются в каждом сообщении. {prefix} — начало кода импорта портала.
#
# === Форматирование ===
# Коды цветов: &0-&f; форматирование: &k-&r (&l = жирный, &r = сброс). Сохраняйте имена переменных и используйте их только в соответствующих сообщениях.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {access}  Политика доступа к порталу
#   {address}  Адрес сетевого узла
#   {after}  Значение сообщения после изменения
#   {allocation}  Распределение карманного пространства
#   {amount}  Стоимость перемещения в валюте Vault
#   {argument}  Неожиданный аргумент команды
#   {before}  Значение сообщения до изменения
#   {biome}  Идентификатор биома
#   {blacklisted}  Заблокированные игроки
#   {block}  Выбранный материал блока
#   {blocks}  Число установленных блоков, затронутых перестройкой
#   {cancel}  Слово отмены ввода в чате
#   {code}  Код сервера или приглашения к порталу
#   {color}  Выбранный цвет отображения
#   {command}  Путь команды
#   {containers}  Число непустых контейнеров, затронутых перестройкой
#   {cost}  Стоимость создания портала или перемещения
#   {count}  Число порталов, назначений или сообщений
#   {degrees}  Угол поворота изображения в градусах
#   {depth}  Глубина проекции
#   {description}  Описание сообщения
#   {destination}  Место назначения
#   {detail}  Дополнительные сведения диагностики
#   {diagnostic}  Диагностическое сообщение
#   {direction}  Направление движения или взгляда
#   {door}  Выходная дверь карманного пространства
#   {duration}  Индивидуальный интервал обновления для игрока
#   {endpoint}  Идентификатор конца червоточины
#   {entities}  Число затронутых сущностей или интервал их обновления в тиках
#   {entity}  Интервал обновления сущностей в тиках
#   {error}  Ошибка последней операции
#   {facing}  Направление портала
#   {failed}  Число неудачных операций
#   {fallback}  Результат альтернативного перемещения
#   {fingerprint}  Отпечаток открытого ключа
#   {free}  Число свободных мест случайных назначений
#   {grace}  Период отсрочки проекции в секундах
#   {group}  Категория редактора переводов
#   {id}  Идентификатор объекта
#   {incoming}  Политика входящего перемещения
#   {item}  Предмет, необходимый для перемещения
#   {key}  Ключ сообщения или настройки
#   {kind}  Тип доступа к двери
#   {label}  Отображаемая метка
#   {large_step}  Шаг изменения при нажатии с Shift
#   {line}  Номер строки в сообщении
#   {locale}  Код языка
#   {material}  Материал стен карманного пространства
#   {maximum}  Максимально допустимое значение
#   {message}  Сообщение обратной связи или диагностики
#   {minimum}  Минимально допустимое значение
#   {mode}  Выбранный режим работы или отображения
#   {name}  Название портала или имя игрока
#   {next}  Следующий доступный вариант
#   {node}  Идентификатор сетевого узла
#   {none}  Метка отсутствующего связанного назначения
#   {other}  Идентификатор связанного конца
#   {outgoing}  Политика исходящего перемещения
#   {owner}  Владелец портала
#   {page}  Номер текущей страницы
#   {pages}  Общее число страниц
#   {parameter}  Название параметра команды
#   {path}  Путь к файлу или каталогу
#   {personal}  Личный код языка
#   {plugin}  Название плагина
#   {portal}  Название или идентификатор портала
#   {prefix}  Начало кода импорта портала
#   {previous}  Прежний размер карманного пространства в блоках
#   {quality}  Качество потока проекции
#   {quantity}  Необходимое число предметов
#   {range}  Дальность активации портала в блоках
#   {readiness}  Состояние готовности случайного назначения
#   {reason}  Причина ошибки или решения
#   {receive}  Состояние приёма проекции
#   {refresh}  Интервал обновления проекции в тиках
#   {reserved}  Число зарезервированных мест случайных назначений
#   {resized}  Число перестроенных карманных пространств
#   {rotation}  Вращение проекции
#   {route}  Маршрут попытки перемещения
#   {rtt}  Время сетевого обмена туда и обратно
#   {seconds}  Время в секундах
#   {send}  Состояние отправки проекции
#   {server}  Название или идентификатор сервера
#   {size}  Размер карманного пространства в блоках
#   {skin}  Выбранный облик портала
#   {skipped}  Число пропущенных операций
#   {space}  Идентификатор карманного пространства
#   {state}  Текущее состояние доступа, связи или сети
#   {step}  Шаг изменения при нажатии
#   {style}  Стиль отображения
#   {target}  Плагин, для которого выбирается язык
#   {type}  Тип объекта или параметра
#   {up}  Направление верха проекции
#   {usage}  Синтаксис команды
#   {value}  Текущее или выбранное значение
#   {variables}  Допустимые переменные сообщения
#   {whitelisted}  Разрешённые игроки
#   {world}  Название мира
#   {x}  Координата X
#   {y}  Координата Y
#   {z}  Координата Z

