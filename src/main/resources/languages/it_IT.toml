# Wormholes — it_IT
#
# === Modifica del file ===
# plugins/Wormholes/languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /wormholes language server edit it_IT
#
# === Prefisso ===
# I prefissi dei messaggi fanno parte dei modelli. {prefix} indica l’inizio del codice d’importazione di un portale.
#
# === Formattazione ===
# Codici colore: &0-&f; formattazione: &k-&r (&l = grassetto, &r = ripristino). Conserva i segnaposto e usali solo nei rispettivi messaggi.
#
# === Variabili ===
# Mantieni i nomi delle variabili e usa solo quelle previste dal singolo messaggio.
#   {access}  Regola di accesso al portale
#   {address}  Indirizzo del nodo remoto
#   {after}  Valore del messaggio dopo la modifica
#   {allocation}  Allocazione dello spazio tascabile
#   {amount}  Costo del viaggio in valuta Vault
#   {argument}  Argomento di comando inatteso
#   {before}  Valore del messaggio prima della modifica
#   {biome}  Identificatore del bioma
#   {blacklisted}  Giocatori bloccati
#   {block}  Materiale del blocco selezionato
#   {blocks}  Blocchi posizionati interessati dalla ricostruzione
#   {cancel}  Parola per annullare l’inserimento in chat
#   {code}  Codice d’invito del server o del portale
#   {color}  Colore di visualizzazione selezionato
#   {command}  Percorso del comando
#   {containers}  Contenitori non vuoti interessati dalla ricostruzione
#   {cost}  Costo di creazione del portale o del viaggio
#   {count}  Numero di portali, destinazioni o messaggi
#   {degrees}  Rotazione dell’immagine in gradi
#   {depth}  Profondità della proiezione
#   {description}  Descrizione del messaggio
#   {destination}  Destinazione del viaggio
#   {detail}  Ulteriori dettagli diagnostici
#   {diagnostic}  Messaggio diagnostico
#   {direction}  Direzione del viaggio o orientamento
#   {door}  Porta di uscita dello spazio tascabile
#   {duration}  Intervallo di aggiornamento specifico del giocatore
#   {endpoint}  Identificatore dell’estremità del wormhole
#   {entities}  Numero di entità interessate o intervallo di aggiornamento in tick
#   {entity}  Intervallo di aggiornamento delle entità in tick
#   {error}  Errore dell’ultima operazione
#   {facing}  Orientamento del portale
#   {failed}  Numero di operazioni fallite
#   {fallback}  Esito alternativo del viaggio
#   {fingerprint}  Impronta della chiave pubblica
#   {free}  Posti disponibili per destinazioni casuali
#   {grace}  Periodo di tolleranza della proiezione in secondi
#   {group}  Categoria dell’editor di lingua
#   {id}  Identificatore dell’oggetto
#   {incoming}  Regola per i viaggi in entrata
#   {item}  Oggetto necessario per il viaggio
#   {key}  Chiave del messaggio o della configurazione
#   {kind}  Tipo di accesso alla porta
#   {label}  Etichetta visualizzata
#   {large_step}  Incremento di regolazione con Maiusc-clic
#   {line}  Numero di riga nel messaggio
#   {locale}  Codice della lingua
#   {material}  Materiale delle pareti dello spazio tascabile
#   {maximum}  Valore massimo consentito
#   {message}  Messaggio di risposta
#   {minimum}  Valore minimo consentito
#   {mode}  Modalità di viaggio o visualizzazione
#   {name}  Nome del portale o del giocatore
#   {next}  Opzione disponibile successiva
#   {node}  Identificatore del nodo di rete
#   {none}  Etichetta per l’assenza di destinazione collegata
#   {other}  Identificatore dell’estremità collegata
#   {outgoing}  Regola per i viaggi in uscita
#   {owner}  Proprietario del portale
#   {page}  Numero della pagina attuale
#   {pages}  Numero totale di pagine
#   {parameter}  Nome del parametro del comando
#   {path}  Percorso del file o della cartella
#   {personal}  Codice della lingua personale
#   {plugin}  Nome del plugin
#   {portal}  Nome o identificatore del portale
#   {prefix}  Inizio del codice d’importazione del portale
#   {previous}  Dimensione precedente dello spazio tascabile in blocchi
#   {quality}  Qualità del flusso della proiezione
#   {quantity}  Numero di oggetti richiesti
#   {range}  Raggio di attivazione del portale in blocchi
#   {readiness}  Stato di disponibilità delle destinazioni casuali
#   {reason}  Motivo dell’errore o della decisione
#   {receive}  Stato di ricezione della proiezione
#   {refresh}  Intervallo di aggiornamento della proiezione in tick
#   {reserved}  Posti riservati per destinazioni casuali
#   {resized}  Numero di spazi tascabili ricostruiti
#   {rotation}  Rotazione della proiezione
#   {route}  Percorso di viaggio tentato
#   {rtt}  Latenza di andata e ritorno della rete
#   {seconds}  Tempo in secondi
#   {send}  Stato di invio della proiezione
#   {server}  Nome o identificatore del server
#   {size}  Dimensione dello spazio tascabile in blocchi
#   {skin}  Aspetto del portale selezionato
#   {skipped}  Numero di operazioni saltate
#   {space}  Identificatore dello spazio tascabile
#   {state}  Stato attuale di accesso, collegamento o rete
#   {step}  Incremento di regolazione al clic
#   {style}  Stile di visualizzazione
#   {target}  Plugin che riceve la selezione della lingua
#   {type}  Tipo di oggetto o parametro
#   {up}  Direzione nella parte superiore della proiezione
#   {usage}  Sintassi del comando
#   {value}  Valore attuale o selezionato
#   {variables}  Segnaposto consentiti nel messaggio
#   {whitelisted}  Giocatori consentiti
#   {world}  Nome del mondo
#   {x}  Coordinata X
#   {y}  Coordinata Y
#   {z}  Coordinata Z

