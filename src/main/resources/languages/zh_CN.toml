[command]
public_help = ["&8[&6Wormholes&8] &7传送门帮助：&f/wormholes info", "&8[&6Wormholes&8] &7对传送门使用传送门法杖，可打开目的地、视图、通行和访问控制。"]
info = ["&8[&6Wormholes&8] &7&l如何建造虫洞&r", "&81. &7从服务器或管理员处获得传送门法杖和传送门符文。", "&82. &7在同一平面上将符文摆成任意相连形状。", "&7   任意相连形状都可以：矩形、直线 (3x1)、单个方块、L 形和十字形。", "&7   符文必须平整地位于同一面与坐标轴对齐的墙、地板或天花板上。", "&83. &7手持传送门法杖，&f左键点击任意符文方块&7以构建传送门。", "&84. &7在其他位置建造第二个传送门(距离和世界不限)。", "&85. &7手持法杖点击已开启的传送门，打开主菜单。", "&7   选择&f目的地&7并选中另一个传送门，然后在另一端重复此操作。", "&7   方向和访问控制分别位于各自的简洁菜单中。", "&86. &7站在任一传送门 {range} 个方块内，目的地世界会投影在框架中；走入框架即可传送。", "&7管理员可使用 &f/wormholes wand 创建物品"]

