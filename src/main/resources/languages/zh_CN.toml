# Wormholes — zh_CN
#
# === 编辑文件 ===
# plugins/Wormholes/languages/zh_CN.toml
# 可以直接编辑此文件。本地修改会保留；缺失、空白或无效的条目先使用备用语言，最后使用英语。
# /wormholes language server edit zh_CN
#
# === 前缀 ===
# 消息前缀位于各自模板中，请逐条编辑。{prefix} 是传送门导入代码的开头。
#
# === 格式 ===
# 颜色代码：&0-&f；格式代码：&k-&r（&l = 粗体，&r = 重置）。请保留变量名称，并仅在对应消息中使用。
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {access}  传送门访问策略
#   {address}  网络对端地址
#   {after}  编辑后的消息值
#   {allocation}  口袋空间分配
#   {amount}  Vault 货币传送费用
#   {argument}  意外的命令参数
#   {before}  编辑前的消息值
#   {biome}  生物群系标识符
#   {blacklisted}  被阻止的玩家
#   {block}  所选方块材质
#   {blocks}  重建影响的已放置方块数量
#   {cancel}  取消聊天输入的词语
#   {code}  服务器或传送门邀请码
#   {color}  所选显示颜色
#   {command}  命令路径
#   {containers}  重建影响的非空容器数量
#   {cost}  传送门创建或传送费用
#   {count}  传送门、目的地或消息数量
#   {degrees}  图像旋转角度
#   {depth}  投影深度
#   {description}  消息说明
#   {destination}  传送目的地
#   {detail}  其他诊断详情
#   {diagnostic}  诊断消息
#   {direction}  传送或朝向方向
#   {door}  口袋空间出口门
#   {duration}  玩家专属更新间隔
#   {endpoint}  虫洞端点标识符
#   {entities}  受影响实体数量或实体更新间隔（刻）
#   {entity}  实体更新间隔（刻）
#   {error}  上次操作的错误
#   {facing}  传送门朝向
#   {failed}  失败的操作数量
#   {fallback}  备用传送结果
#   {fingerprint}  公钥指纹
#   {free}  空闲随机目的地槽位数量
#   {grace}  投影宽限时间（秒）
#   {group}  语言编辑器类别
#   {id}  对象标识符
#   {incoming}  入站传送策略
#   {item}  传送所需物品
#   {key}  消息或配置键
#   {kind}  门访问类型
#   {label}  显示标签
#   {large_step}  按住 Shift 点击时的调整量
#   {line}  消息内的行号
#   {locale}  语言代码
#   {material}  口袋空间墙壁材质
#   {maximum}  允许的最大值
#   {message}  反馈或诊断消息
#   {minimum}  允许的最小值
#   {mode}  所选操作或显示模式
#   {name}  传送门或玩家名称
#   {next}  下一个可用选项
#   {node}  网络节点标识符
#   {none}  未连接目的地的标签
#   {other}  已连接端点标识符
#   {outgoing}  出站传送策略
#   {owner}  传送门所有者
#   {page}  当前页码
#   {pages}  总页数
#   {parameter}  命令参数名称
#   {path}  文件或目录路径
#   {personal}  个人语言代码
#   {plugin}  插件名称
#   {portal}  传送门名称或标识符
#   {prefix}  传送门导入代码的开头
#   {previous}  之前的口袋空间大小（方块）
#   {quality}  投影流质量
#   {quantity}  所需物品数量
#   {range}  传送门激活范围（方块）
#   {readiness}  随机目的地就绪状态
#   {reason}  错误或决定的原因
#   {receive}  投影接收状态
#   {refresh}  投影刷新间隔（刻）
#   {reserved}  已预留随机目的地槽位数量
#   {resized}  已重建口袋空间数量
#   {rotation}  投影旋转
#   {route}  尝试的传送路线
#   {rtt}  网络往返延迟
#   {seconds}  时间（秒）
#   {section}  语言编辑器分区
#   {send}  投影发送状态
#   {server}  服务器名称或标识符
#   {size}  口袋空间大小（方块）
#   {skin}  所选传送门皮肤
#   {skipped}  已跳过操作数量
#   {space}  口袋空间标识符
#   {state}  当前访问、连接或网络状态
#   {step}  点击时的调整量
#   {style}  显示样式
#   {target}  应用语言选择的插件
#   {type}  对象或参数类型
#   {up}  投影顶部方向
#   {value}  当前或所选值
#   {variables}  消息允许的占位符
#   {whitelisted}  允许的玩家
#   {world}  世界名称
#   {x}  X 坐标
#   {y}  Y 坐标
#   {z}  Z 坐标

