"command.info" = ["<dark_gray>[<gold>Wormholes<dark_gray>] <gray><bold>如何建造虫洞</bold>","<dark_gray>1. <gray>从服务器或管理员处获得传送门法杖和传送门符文。","<dark_gray>2. <gray>在同一平面上将符文摆成任意相连形状。","<gray>   任意相连形状都可以：矩形、直线 (3x1)、单个方块、L 形和十字形。","<gray>   符文必须平整地位于同一面与坐标轴对齐的墙、地板或天花板上。","<dark_gray>3. <gray>手持传送门法杖，<white>左键点击任意符文方块<gray>以构建传送门。","<dark_gray>4. <gray>在其他位置建造第二个传送门(距离和世界不限)。","<dark_gray>5. <gray>手持法杖点击已开启的传送门，打开主菜单。","<gray>   选择<white>目的地<gray>并选中另一个传送门，然后在另一端重复此操作。","<gray>   方向和访问控制分别位于各自的简洁菜单中。","<dark_gray>6. <gray>站在任一传送门 {range} 个方块内，目的地世界会投影在框架中；走入框架即可传送。","<gray>管理员可使用 <white>/wormholes wand 创建物品"]
