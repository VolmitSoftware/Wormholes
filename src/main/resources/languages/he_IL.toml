# Wormholes — he_IL
#
# === עריכת הקובץ ===
# plugins/Wormholes/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. השינויים המקומיים נשמרים; ערכים חסרים, ריקים או לא תקינים משתמשים בשפות הגיבוי ולאחר מכן באנגלית.
# /wormholes language server edit he_IL
#
# === קידומת ===
# קידומות ההודעות כתובות בתבניות עצמן; יש לשנות אותן בכל הודעה. {prefix} הוא תחילת קוד ייבוא שער.
#
# === עיצוב ===
# קודי צבע: &0-&f; עיצוב: &k-&r (&l = מודגש, &r = איפוס). יש לשמור על שמות המשתנים ולהשתמש בהם רק בהודעות המתאימות.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {access}  מדיניות הגישה לשער
#   {address}  כתובת עמית הרשת
#   {after}  ערך ההודעה לאחר העריכה
#   {allocation}  הקצאת מרחב הכיס
#   {amount}  עלות הנסיעה במטבע Vault
#   {argument}  ארגומנט פקודה לא צפוי
#   {before}  ערך ההודעה לפני העריכה
#   {biome}  מזהה הביומה
#   {blacklisted}  השחקנים החסומים
#   {block}  חומר הבלוק הנבחר
#   {blocks}  מספר הבלוקים המוצבים שייפגעו בבנייה מחדש
#   {cancel}  מילת ביטול הקלט בצ׳אט
#   {code}  קוד השרת או הזמנת השער
#   {color}  צבע התצוגה הנבחר
#   {command}  נתיב הפקודה
#   {containers}  מספר המכלים הלא ריקים שייפגעו בבנייה מחדש
#   {cost}  עלות יצירת השער או הנסיעה
#   {count}  מספר השערים, היעדים או ההודעות
#   {degrees}  זווית סיבוב התמונה במעלות
#   {depth}  עומק ההקרנה
#   {description}  תיאור ההודעה
#   {destination}  יעד הנסיעה
#   {detail}  פרטי אבחון נוספים
#   {diagnostic}  הודעת אבחון
#   {direction}  כיוון הנסיעה או המבט
#   {door}  דלת היציאה מהכיס
#   {duration}  מרווח העדכון האישי לשחקן
#   {endpoint}  מזהה קצה חור התולעת
#   {entities}  מספר הישויות המושפעות או מרווח עדכונן בטיקים
#   {entity}  מרווח עדכון הישויות בטיקים
#   {error}  שגיאת הפעולה האחרונה
#   {facing}  כיוון השער
#   {failed}  מספר הפעולות שנכשלו
#   {fallback}  תוצאת הנסיעה החלופית
#   {fingerprint}  טביעת המפתח הציבורי
#   {free}  מספר משבצות היעד האקראי הפנויות
#   {grace}  תקופת השהיית ההקרנה בשניות
#   {group}  קטגוריית עורך השפות
#   {id}  מזהה העצם
#   {incoming}  מדיניות הנסיעה הנכנסת
#   {item}  הפריט הנדרש לנסיעה
#   {key}  מפתח הודעה או הגדרה
#   {kind}  סוג הגישה לדלת
#   {label}  תווית התצוגה
#   {large_step}  גודל השינוי בלחיצה עם Shift
#   {line}  מספר השורה בהודעה
#   {locale}  קוד השפה
#   {material}  חומר קירות הכיס
#   {maximum}  הערך המרבי המותר
#   {message}  הודעת משוב או אבחון
#   {minimum}  הערך המזערי המותר
#   {mode}  מצב הפעולה או התצוגה הנבחר
#   {name}  שם השער או השחקן
#   {next}  האפשרות הזמינה הבאה
#   {node}  מזהה צומת הרשת
#   {none}  תווית המציינת שאין יעד מקושר
#   {other}  מזהה הקצה המקושר
#   {outgoing}  מדיניות הנסיעה היוצאת
#   {owner}  בעל השער
#   {page}  מספר העמוד הנוכחי
#   {pages}  מספר העמודים הכולל
#   {parameter}  שם פרמטר הפקודה
#   {path}  נתיב הקובץ או התיקייה
#   {personal}  קוד השפה האישי
#   {plugin}  שם התוסף
#   {portal}  שם השער או מזההו
#   {prefix}  תחילת קוד ייבוא השער
#   {previous}  גודל הכיס הקודם בבלוקים
#   {quality}  איכות זרם ההקרנה
#   {quantity}  מספר הפריטים הנדרש
#   {range}  טווח הפעלת השער בבלוקים
#   {readiness}  מצב מוכנות היעד האקראי
#   {reason}  הסיבה לשגיאה או להחלטה
#   {receive}  מצב קבלת ההקרנה
#   {refresh}  מרווח רענון ההקרנה בטיקים
#   {reserved}  מספר משבצות היעד האקראי השמורות
#   {resized}  מספר הכיסים שנבנו מחדש
#   {rotation}  סיבוב ההקרנה
#   {route}  מסלול הנסיעה שנוסה
#   {rtt}  השהיית הרשת הלוך ושוב
#   {seconds}  משך בשניות
#   {section}  מקטע בעורך השפה
#   {send}  מצב שליחת ההקרנה
#   {server}  שם השרת או מזההו
#   {size}  גודל הכיס בבלוקים
#   {skin}  מראה השער הנבחר
#   {skipped}  מספר הפעולות שדולגו
#   {space}  מזהה מרחב הכיס
#   {state}  מצב הגישה, הקישור או הרשת הנוכחי
#   {step}  גודל השינוי בלחיצה
#   {style}  סגנון התצוגה
#   {target}  התוסף שמקבל את בחירת השפה
#   {type}  סוג העצם או הפרמטר
#   {up}  הכיוון בחלק העליון של ההקרנה
#   {value}  הערך הנוכחי או הנבחר
#   {variables}  מצייני המקום המותרים בהודעה
#   {whitelisted}  השחקנים המורשים
#   {world}  שם העולם
#   {x}  קואורדינטת X
#   {y}  קואורדינטת Y
#   {z}  קואורדינטת Z

