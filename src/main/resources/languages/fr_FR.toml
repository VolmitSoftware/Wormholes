# Wormholes — fr_FR
#
# === Modifier le fichier ===
# plugins/Wormholes/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes, vides ou invalides utilisent les langues de secours, puis l’anglais.
# /wormholes language server edit fr_FR
#
# === Préfixe ===
# Les préfixes des messages font partie de leurs modèles. {prefix} désigne le début d’un code d’importation de portail.
#
# === Mise en forme ===
# Codes couleur : &0-&f ; mise en forme : &k-&r (&l = gras, &r = réinitialiser). Conservez les variables et utilisez-les uniquement dans leur message respectif.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {access}  Règle d’accès au portail
#   {address}  Adresse du pair réseau
#   {after}  Valeur du message après modification
#   {allocation}  Allocation de l’espace de poche
#   {amount}  Coût du trajet en monnaie Vault
#   {argument}  Argument de commande inattendu
#   {before}  Valeur du message avant modification
#   {biome}  Identifiant du biome
#   {blacklisted}  Joueurs bloqués
#   {block}  Matériau du bloc sélectionné
#   {blocks}  Blocs placés concernés par la reconstruction
#   {cancel}  Mot d’annulation de la saisie dans le chat
#   {code}  Code d’invitation du serveur ou du portail
#   {color}  Couleur d’affichage sélectionnée
#   {command}  Chemin de la commande
#   {containers}  Conteneurs non vides concernés par la reconstruction
#   {cost}  Coût de création du portail ou du trajet
#   {count}  Nombre de portails, de destinations ou de messages
#   {degrees}  Rotation de l’image en degrés
#   {depth}  Profondeur de projection
#   {description}  Description du message
#   {destination}  Destination du trajet
#   {detail}  Détails de diagnostic supplémentaires
#   {diagnostic}  Message de diagnostic
#   {direction}  Sens du trajet ou orientation
#   {door}  Porte de sortie de l’espace de poche
#   {duration}  Intervalle de mise à jour propre au joueur
#   {endpoint}  Identifiant de l’extrémité du trou de ver
#   {entities}  Nombre d’entités concernées ou intervalle de mise à jour en ticks
#   {entity}  Intervalle de mise à jour des entités en ticks
#   {error}  Erreur de la dernière opération
#   {facing}  Orientation du portail
#   {failed}  Nombre d’opérations échouées
#   {fallback}  Résultat de trajet de remplacement
#   {fingerprint}  Empreinte de la clé publique
#   {free}  Emplacements de destinations aléatoires disponibles
#   {grace}  Délai de grâce de la projection en secondes
#   {group}  Catégorie de l’éditeur de langue
#   {id}  Identifiant de l’objet
#   {incoming}  Règle des trajets entrants
#   {item}  Objet requis pour le trajet
#   {key}  Clé de message ou de configuration
#   {kind}  Type d’accès à la porte
#   {label}  Libellé affiché
#   {large_step}  Pas de réglage avec Maj-clic
#   {line}  Numéro de ligne dans le message
#   {locale}  Code de langue
#   {material}  Matériau des murs de l’espace de poche
#   {maximum}  Valeur maximale autorisée
#   {message}  Message de retour
#   {minimum}  Valeur minimale autorisée
#   {mode}  Mode de trajet ou d’affichage
#   {name}  Nom du portail ou du joueur
#   {next}  Option disponible suivante
#   {node}  Identifiant du nœud réseau
#   {none}  Libellé indiquant l’absence de destination liée
#   {other}  Identifiant de l’extrémité liée
#   {outgoing}  Règle des trajets sortants
#   {owner}  Propriétaire du portail
#   {page}  Numéro de la page actuelle
#   {pages}  Nombre total de pages
#   {parameter}  Nom du paramètre de commande
#   {path}  Chemin du fichier ou du dossier
#   {personal}  Code de langue personnel
#   {plugin}  Nom du plugin
#   {portal}  Nom ou identifiant du portail
#   {prefix}  Début d’un code d’importation de portail
#   {previous}  Taille précédente de l’espace de poche en blocs
#   {quality}  Qualité du flux de projection
#   {quantity}  Nombre d’objets requis
#   {range}  Portée d’activation du portail en blocs
#   {readiness}  État de préparation des destinations aléatoires
#   {reason}  Motif de l’erreur ou de la décision
#   {receive}  État de réception de la projection
#   {refresh}  Intervalle d’actualisation de la projection en ticks
#   {reserved}  Emplacements de destinations aléatoires réservés
#   {resized}  Nombre d’espaces de poche reconstruits
#   {rotation}  Rotation de la projection
#   {route}  Itinéraire de trajet tenté
#   {rtt}  Latence réseau aller-retour
#   {seconds}  Durée en secondes
#   {section}  Section de l’éditeur de langue
#   {send}  État d’envoi de la projection
#   {server}  Nom ou identifiant du serveur
#   {size}  Taille de l’espace de poche en blocs
#   {skin}  Apparence de portail sélectionnée
#   {skipped}  Nombre d’opérations ignorées
#   {space}  Identifiant de l’espace de poche
#   {state}  État actuel de l’accès, du lien ou du réseau
#   {step}  Pas de réglage au clic
#   {style}  Style d’affichage
#   {target}  Plugin recevant la sélection de langue
#   {type}  Type d’objet ou de paramètre
#   {up}  Direction en haut de la projection
#   {value}  Valeur actuelle ou sélectionnée
#   {variables}  Variables autorisées dans le message
#   {whitelisted}  Joueurs autorisés
#   {world}  Nom du monde
#   {x}  Coordonnée X
#   {y}  Coordonnée Y
#   {z}  Coordonnée Z

