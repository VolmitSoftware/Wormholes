info = ["&8[&6Wormholes&8] &7&lKaip pastatyti kirmgraužą&r", "&81. &7Gaukite portalo lazdelę ir kirmgraužos runų iš serverio arba administratoriaus.", "&82. &7Sudėkite runas į bet kokią sujungtą formą ant vieno lygaus paviršiaus.", "&7   Tinka bet kokia sujungta forma: stačiakampis, linija (3x1), vienas blokas, L forma ar kryžius.", "&7   Runos turi gulėti ant tos pačios su ašimis lygiagrečios sienos, grindų arba lubų.", "&83. &7Laikykite portalo lazdelę ir &fkairiuoju pelės mygtuku spustelėkite bet kurį runos bloką&7, kad sukurtumėte portalą.", "&84. &7Kitur pastatykite ANTRĄ portalą (bet kokiu atstumu ir bet kuriame pasaulyje).", "&85. &7Atverkite portalo meniu žiūrėdami į portalą su lazdele rankoje arba sėlinkite tuščia pagrindine ranka ir dešiniuoju pelės mygtuku spustelėkite portalo bloką (savininkas arba administratorius).", "&7   Pasirinkite &fTikslas&7 ir kitą portalą. Pakartokite iš kitos pusės.", "&7   Krypties ir prieigos valdikliai pateikiami atskiruose paprastuose meniu.", "&86. &7Stovėkite ne toliau kaip {range} blokų atstumu nuo vieno iš portalų (dabartinis bendras aktyvavimo atstumas) — tikslinis pasaulis bus projektuojamas rėme, o įžengę teleportuositės.", "&7Administratoriai gali kurti daiktus su &f/wormholes wand"]

