# Wormholes — lt_LT
#
# === Failo redagavimas ===
# plugins/Wormholes/languages/lt_LT.toml
# Šį failą galima redaguoti tiesiogiai. Vietiniai pakeitimai išsaugomi; trūkstami, tušti ar netinkami įrašai naudoja atsargines kalbas, o po jų naudojama anglų kalba.
# /wormholes language server edit lt_LT
#
# === Priešdėlis ===
# Pranešimų priešdėliai yra jų šablonų dalis. {prefix} reiškia portalo importavimo kodo pradžią.
#
# === Formatavimas ===
# Spalvų kodai: &0-&f; formatavimas: &k-&r (&l = paryškinti, &r = atkurti). Nekeiskite kintamųjų vardų ir naudokite juos tik atitinkamuose pranešimuose.
#
# === Kintamieji ===
# Nekeiskite kintamųjų pavadinimų ir naudokite tik konkrečiame pranešime esančius kintamuosius.
#   {access}  Prieigos prie portalo taisyklė
#   {added}  Kalbos atnaujinimo pridėtų pranešimų skaičius
#   {address}  Kito tinklo mazgo adresas
#   {after}  Pranešimo reikšmė po redagavimo
#   {allocation}  Kišeninės erdvės paskirstymas
#   {amount}  Kelionės kaina valiuta
#   {argument}  Netikėtas komandos argumentas
#   {before}  Pranešimo reikšmė prieš redagavimą
#   {biome}  Biomo identifikatorius
#   {blacklisted}  Užblokuoti žaidėjai
#   {block}  Pasirinkta bloko medžiaga
#   {blocks}  Perstatymo paveikti padėti blokai
#   {cancel}  Pokalbio įvesties atšaukimo žodis
#   {cells}  Atvirų angos langelių skaičius
#   {code}  Serverio arba portalo kvietimo kodas
#   {color}  Pasirinkta rodymo spalva
#   {command}  Komandos kelias
#   {containers}  Perstatymo paveiktos netuščios talpyklos
#   {cost}  Portalo sukūrimo arba kelionės kaina
#   {count}  Portalų, tikslų arba pranešimų skaičius
#   {degrees}  Vaizdo pasukimas laipsniais
#   {depth}  Projekcijos gylis
#   {description}  Pranešimo aprašymas
#   {destination}  Kelionės tikslas
#   {detail}  Papildoma diagnostikos informacija
#   {diagnostic}  Diagnostikos pranešimas
#   {direction}  Kelionės arba žiūrėjimo kryptis
#   {door}  Kišeninės erdvės išėjimo durys
#   {duration}  Žaidėjui taikomas atnaujinimo intervalas
#   {endpoint}  Kirmgraužos galinio taško identifikatorius
#   {entities}  Paveiktų esybių skaičius arba atnaujinimo intervalas tickais
#   {entity}  Esybių atnaujinimo intervalas tickais
#   {error}  Paskutinės operacijos klaida
#   {facing}  Portalo orientacija
#   {failed}  Nepavykusių operacijų skaičius
#   {fallback}  Alternatyvus kelionės rezultatas
#   {fingerprint}  Viešojo rakto kontrolinis atspaudas
#   {free}  Laisvos atsitiktinių tikslų vietos
#   {grace}  Projekcijos atidėjimo laikotarpis sekundėmis
#   {group}  Kalbos rengyklės kategorija
#   {id}  Objekto identifikatorius
#   {incoming}  Atvykstančių kelionių taisyklė
#   {item}  Kelionei reikalingas daiktas
#   {kept}  Kalbos atnaujinimo išsaugoti vietiniai pakeitimai
#   {key}  Pranešimo arba nuostatos raktas
#   {kind}  Prieigos prie durų tipas
#   {label}  Rodoma žyma
#   {large_step}  Keitimo dydis spustelėjus laikant Shift
#   {line}  Eilutės numeris pranešime
#   {locale}  Kalbos kodas
#   {material}  Kišeninės erdvės sienų medžiaga
#   {maximum}  Didžiausia leidžiama reikšmė
#   {message}  Atsakymo pranešimas
#   {minimum}  Mažiausia leidžiama reikšmė
#   {mode}  Kelionės arba rodymo režimas
#   {name}  Portalo pavadinimas arba žaidėjo vardas
#   {next}  Kita galima parinktis
#   {node}  Tinklo mazgo identifikatorius
#   {none}  Žyma, kai nėra susieto tikslo
#   {other}  Susieto galinio taško identifikatorius
#   {outgoing}  Išvykstančių kelionių taisyklė
#   {owner}  Portalo savininkas
#   {page}  Dabartinio puslapio numeris
#   {pages}  Bendras puslapių skaičius
#   {parameter}  Komandos parametro pavadinimas
#   {path}  Failo arba katalogo kelias
#   {personal}  Asmeninis kalbos kodas
#   {plugin}  Papildinio pavadinimas
#   {portal}  Portalo pavadinimas arba identifikatorius
#   {prefix}  Portalo importavimo kodo pradžia
#   {previous}  Ankstesnis kišeninės erdvės dydis blokais
#   {quality}  Projekcijos srauto kokybė
#   {quantity}  Reikalingų daiktų skaičius
#   {range}  Portalo aktyvavimo atstumas blokais
#   {readiness}  Atsitiktinio tikslo parengties būsena
#   {reason}  Klaidos arba sprendimo priežastis
#   {receive}  Projekcijos gavimo būsena
#   {refresh}  Projekcijos atnaujinimo intervalas tickais
#   {remaining}  Laikas iki kito leidžiamo kalbų tikrinimo
#   {reserved}  Rezervuotos atsitiktinių tikslų vietos
#   {resized}  Perstatytų kišeninių erdvių skaičius
#   {rotation}  Projekcijos pasukimas
#   {route}  Bandytas kelionės maršrutas
#   {rtt}  Tinklo užklausos ir atsakymo delsa
#   {seconds}  Laikas sekundėmis
#   {section}  Kalbos rengyklės skyrius
#   {send}  Projekcijos siuntimo būsena
#   {server}  Serverio pavadinimas arba identifikatorius
#   {shape}  Portalo angos forma
#   {size}  Kišeninės erdvės dydis blokais
#   {skin}  Pasirinkta portalo išvaizda
#   {skipped}  Praleistų operacijų skaičius
#   {space}  Kišeninės erdvės identifikatorius
#   {state}  Dabartinė prieigos, ryšio arba tinklo būsena
#   {step}  Keitimo dydis spustelėjus
#   {style}  Rodymo stilius
#   {target}  Kalbos pasirinkimą gaunantis papildinys
#   {type}  Objekto arba parametro tipas
#   {up}  Kryptis projekcijos viršuje
#   {updated}  Kalbos atnaujinimo pakeistų pranešimų skaičius
#   {value}  Dabartinė arba pasirinkta reikšmė
#   {variables}  Pranešime leidžiami kintamieji
#   {whitelisted}  Leidžiami žaidėjai
#   {world}  Pasaulio pavadinimas
#   {x}  X koordinatė
