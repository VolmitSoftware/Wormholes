"command.stats.path" = ["<dark_gray>[<gold>Wormholes<dark_gray>] <gray>Plik migawki: <white>{path}","<dark_gray>[<gold>Wormholes<dark_gray>] <dark_gray>Obserwuj ten plik, aby udostępniać bieżący stan sieci i widoków. Jest zastępowany w każdym interwale."]
"command.info" = ["<dark_gray>[<gold>Wormholes<dark_gray>] <gray><bold>Jak zbudować tunel czasoprzestrzenny</bold>","<dark_gray>1. <gray>Zdobądź Różdżkę Portalu i runy portalu od serwera lub administratora.","<dark_gray>2. <gray>Ułóż runy w dowolny połączony kształt na jednej płaskiej powierzchni.","<gray>   Działa każdy połączony kształt: prostokąt, linia (3x1), pojedynczy blok, litera L lub krzyż.","<gray>   Runy muszą leżeć płasko na tej samej ścianie, podłodze lub suficie wyrównanym do osi.","<dark_gray>3. <gray>Trzymaj Różdżkę Portalu i <white>kliknij lewym przyciskiem blok runy<gray>, aby utworzyć portal.","<dark_gray>4. <gray>Zbuduj DRUGI portal w innym miejscu (w dowolnej odległości i w dowolnym świecie).","<dark_gray>5. <gray>Kliknij otwarty portal różdżką, aby otworzyć menu główne.","<gray>   Wybierz <white>Cel<gray> i drugi portal. Powtórz po drugiej stronie.","<gray>   Orientacja i dostęp znajdują się w oddzielnych, prostych menu.","<dark_gray>6. <gray>Stań w odległości {range} bloków od jednego z portali — świat docelowy pojawi się w ramie, a wejście do niej cię teleportuje.","<gray>Administratorzy mogą tworzyć przedmioty poleceniem <white>/wormholes wand"]
