# Wormholes — pl_PL
#
# === Edycja pliku ===
# plugins/Wormholes/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące, puste lub nieprawidłowe wpisy korzystają z języków zastępczych, a następnie z angielskiego.
# /wormholes language server edit pl_PL
#
# === Prefiks ===
# Prefiksy wiadomości są częścią odpowiednich szablonów. {prefix} oznacza początek kodu importu portalu.
#
# === Formatowanie ===
# Kody kolorów: &0-&f; formatowanie: &k-&r (&l = pogrubienie, &r = reset). Zachowaj nazwy zmiennych i używaj ich tylko w odpowiednich komunikatach.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {access}  Zasady dostępu do portalu
#   {address}  Adres sieciowy węzła zdalnego
#   {after}  Treść wiadomości po edycji
#   {allocation}  Przydzielona przestrzeń kieszeni
#   {amount}  Koszt podróży w walucie Vault
#   {argument}  Nieoczekiwany argument polecenia
#   {before}  Treść wiadomości przed edycją
#   {biome}  Identyfikator biomu
#   {blacklisted}  Zablokowani gracze
#   {block}  Materiał wybranego bloku
#   {blocks}  Postawione bloki objęte przebudową
#   {cancel}  Słowo anulujące wprowadzanie na czacie
#   {code}  Kod zaproszenia do serwera lub portalu
#   {color}  Wybrany kolor wyświetlania
#   {command}  Ścieżka polecenia
#   {containers}  Niepuste pojemniki objęte przebudową
#   {cost}  Koszt utworzenia portalu lub podróży
#   {count}  Liczba portali, celów lub wiadomości
#   {degrees}  Obrót obrazu w stopniach
#   {depth}  Głębokość projekcji
#   {description}  Opis wiadomości
#   {destination}  Cel podróży
#   {detail}  Dodatkowe informacje diagnostyczne
#   {diagnostic}  Komunikat diagnostyczny
#   {direction}  Kierunek podróży lub orientacji
#   {door}  Drzwi wyjściowe kieszeni
#   {duration}  Odstęp aktualizacji dla danego gracza
#   {endpoint}  Identyfikator końca tunelu
#   {entities}  Liczba objętych zmianą bytów lub odstęp ich aktualizacji w tickach
#   {entity}  Odstęp aktualizacji bytów w tickach
#   {error}  Błąd ostatniej operacji
#   {facing}  Orientacja portalu
#   {failed}  Liczba nieudanych operacji
#   {fallback}  Alternatywny wynik podróży
#   {fingerprint}  Odcisk klucza publicznego
#   {free}  Wolne miejsca na losowe cele
#   {grace}  Okres podtrzymania projekcji w sekundach
#   {group}  Kategoria edytora języka
#   {id}  Identyfikator obiektu
#   {incoming}  Zasady podróży przychodzących
#   {item}  Przedmiot wymagany do podróży
#   {key}  Klucz wiadomości lub ustawienia
#   {kind}  Rodzaj dostępu przez drzwi
#   {label}  Wyświetlana etykieta
#   {large_step}  Wielkość zmiany po kliknięciu z klawiszem Shift
#   {line}  Numer wiersza w wiadomości
#   {locale}  Kod języka
#   {material}  Materiał ścian kieszeni
#   {maximum}  Maksymalna dopuszczalna wartość
#   {message}  Komunikat zwrotny
#   {minimum}  Minimalna dopuszczalna wartość
#   {mode}  Tryb podróży lub wyświetlania
#   {name}  Nazwa portalu lub gracza
#   {next}  Następna dostępna opcja
#   {node}  Identyfikator węzła sieciowego
#   {none}  Etykieta braku połączonego celu
#   {other}  Identyfikator połączonego końca tunelu
#   {outgoing}  Zasady podróży wychodzących
#   {owner}  Właściciel portalu
#   {page}  Numer bieżącej strony
#   {pages}  Łączna liczba stron
#   {parameter}  Nazwa parametru polecenia
#   {path}  Ścieżka pliku lub katalogu
#   {personal}  Kod osobistego języka
#   {plugin}  Nazwa wtyczki
#   {portal}  Nazwa lub identyfikator portalu
#   {prefix}  Początek kodu importu portalu
#   {previous}  Poprzedni rozmiar kieszeni w blokach
#   {quality}  Jakość strumienia projekcji
#   {quantity}  Wymagana liczba przedmiotów
#   {range}  Zasięg aktywacji portalu w blokach
#   {readiness}  Stan gotowości losowych celów
#   {reason}  Przyczyna błędu lub decyzji
#   {receive}  Stan odbierania projekcji
#   {refresh}  Odstęp odświeżania projekcji w tickach
#   {reserved}  Zarezerwowane miejsca na losowe cele
#   {resized}  Liczba przebudowanych kieszeni
#   {rotation}  Obrót projekcji
#   {route}  Podjęta trasa podróży
#   {rtt}  Opóźnienie sieciowe w obie strony
#   {seconds}  Czas w sekundach
#   {section}  Sekcja edytora języka
#   {send}  Stan wysyłania projekcji
#   {server}  Nazwa lub identyfikator serwera
#   {size}  Rozmiar kieszeni w blokach
#   {skin}  Wybrany wygląd portalu
#   {skipped}  Liczba pominiętych operacji
#   {space}  Identyfikator przestrzeni kieszeni
#   {state}  Bieżący stan dostępu, połączenia lub sieci
#   {step}  Wielkość zmiany po kliknięciu
#   {style}  Styl wyświetlania
#   {target}  Wtyczka, dla której wybierany jest język
#   {type}  Typ obiektu lub parametru
#   {up}  Kierunek u góry projekcji
#   {value}  Bieżąca lub wybrana wartość
#   {variables}  Dozwolone zmienne wiadomości
#   {whitelisted}  Dozwoleni gracze
#   {world}  Nazwa świata
#   {x}  Współrzędna X
#   {y}  Współrzędna Y
#   {z}  Współrzędna Z

