Properties gameTestProperties = new Properties()
file('../../gradle.properties').withInputStream { InputStream stream -> gameTestProperties.load(stream) }

sourceSets {
    gameTest {
        java.srcDir('../modded-common/src/gameTest/java')
        resources.srcDir('../modded-common/src/gameTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.named('check').configure {
    dependsOn(tasks.named('gameTestClasses'))
}

tasks.named('processGameTestResources').configure {
    inputs.property('version', project.version)
    inputs.property('minecraftVersion', gameTestProperties.getProperty('minecraftVersion'))
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand('version': project.version, 'minecraftVersion': gameTestProperties.getProperty('minecraftVersion'))
    }
}

tasks.register('gameTestJar', project.ext.shadowJarType) {
    group = 'verification'
    dependsOn(tasks.named('shadowJar'), tasks.named('gameTestClasses'))
    archiveFileName.set('Wormholes-GameTest.jar')
    configurations = []
    relocate('net.kyori', 'art.arcane.wormholes.shadow.kyori')
    relocate('art.arcane.volmlib', 'art.arcane.wormholes.shadow.volmlib')
    if (project.name != 'wormholes-fabric') {
        manifest.from(tasks.named('shadowJar').get().manifest)
        from({ zipTree(tasks.named('shadowJar').get().archiveFile.get().asFile) }) {
            exclude('fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml')
            exclude('art/arcane/wormholes/fabric/**', 'art/arcane/wormholes/forge/**', 'art/arcane/wormholes/neoforge/**')
        }
    }
    from(sourceSets.gameTest.output)
}
