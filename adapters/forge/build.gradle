import org.gradle.api.tasks.TaskProvider
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'com.gradleup.shadow' version '9.5.1'
}

Properties rootProperties = new Properties()
file('../../gradle.properties').withInputStream { InputStream stream -> rootProperties.load(stream) }
String minecraftVersion = providers.gradleProperty('minecraftVersion').getOrElse(rootProperties.getProperty('minecraftVersion'))
String loaderVersion = providers.gradleProperty('forgeVersion').getOrElse(rootProperties.getProperty('forgeVersion'))
project(':core') {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('core'))
}
project(':optics') {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('optics'))
}

group = 'art.arcane'
version = providers.gradleProperty('wormholesVersion').getOrElse(rootProperties.getProperty('wormholesVersion'))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java.srcDir('../modded-common/src/main/java')
        resources.srcDir('../modded-common/src/main/resources')
    }
    test {
        java.srcDir('../modded-common/src/test/java')
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://api.modrinth.com/maven') }
    maven {
        url = uri('https://maven.fabricmc.net/')
        content { includeGroup('net.fabricmc') }
    }
    maven { url = uri('https://maven.minecraftforge.net/') }
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

configurations {
    irisParserApi {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    bundle {
        canBeConsumed = false
        canBeResolved = true
        exclude(group: 'it.unimi.dsi', module: 'fastutil')
    }
}

TaskProvider<Sync> extractIrisParserApi = tasks.register('extractIrisParserApi', Sync) {
    from({ zipTree(configurations.irisParserApi.singleFile) })
    include('META-INF/jars/glsl-transformer-3.0.0-pre3.jar')
    include('META-INF/jars/antlr4-runtime-4.13.1.jar')
    into(layout.buildDirectory.dir('iris-parser-api'))
}
FileCollection irisParserClasses = files(
    layout.buildDirectory.file('iris-parser-api/META-INF/jars/glsl-transformer-3.0.0-pre3.jar'),
    layout.buildDirectory.file('iris-parser-api/META-INF/jars/antlr4-runtime-4.13.1.jar')).builtBy(extractIrisParserApi)

dependencies {
    irisParserApi('maven.modrinth:iris:vTN4NRGW')
    compileOnly(irisParserClasses)
    testImplementation(irisParserClasses)
    compileOnly('maven.modrinth:iris:vTN4NRGW') { transitive = false }
    compileOnly('maven.modrinth:sodium:v4PSXean') { transitive = false }
    testImplementation('maven.modrinth:iris:vTN4NRGW') { transitive = false }
    testImplementation('maven.modrinth:sodium:v4PSXean') { transitive = false }
    implementation(project(':core'))
    bundle(project(':core'))
    implementation(project(':optics'))
    bundle(project(':optics'))
    implementation('com.github.VolmitSoftware.VolmLib:volmlib-web:master-SNAPSHOT')
    bundle('com.github.VolmitSoftware.VolmLib:volmlib-web:master-SNAPSHOT')
    testImplementation('junit:junit:4.13.2')
    testImplementation('org.mockito:mockito-core:5.23.0')
    testRuntimeOnly('io.github.llamalad7:mixinextras-common:0.5.4')
    testRuntimeOnly("net.fabricmc:fabric-loader:${rootProperties.getProperty('fabricLoaderVersion')}")
    implementation minecraft.dependency("net.minecraftforge:forge:${loaderVersion}")
}

minecraft {
    runs {
        register('server') {
            workingDir = layout.projectDirectory.dir('run')
            args('--nogui')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    options.compilerArgs.add('-parameters')
}

processResources {
    filesMatching('wormholes-build.properties') {
        expand('version': project.version)
    }
    inputs.property('version', project.version)
    inputs.property('minecraftVersion', minecraftVersion)
    filesMatching('META-INF/mods.toml') {
        expand('version': project.version, 'minecraftVersion': minecraftVersion)
    }
}

tasks.named('shadowJar', ShadowJar).configure {
    String displayVersion = loaderVersion.startsWith(minecraftVersion + '-') ? loaderVersion.substring(minecraftVersion.length() + 1) : loaderVersion
    archiveFileName.set("Wormholes v${project.version} [Forge] ${minecraftVersion}+${displayVersion}.jar")
    configurations = [project.configurations.bundle]
    manifest.attributes('MixinConfigs': 'wormholes.mixins.json')
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    relocate('net.kyori', 'art.arcane.wormholes.shadow.kyori')
    relocate('art.arcane.volmlib', 'art.arcane.wormholes.shadow.volmlib')
    relocate('org.yaml.snakeyaml', 'art.arcane.wormholes.shadow.snakeyaml')
    relocate('com.electronwill.nightconfig', 'art.arcane.wormholes.shadow.nightconfig')
    relocate('com.moandjiezana.toml', 'art.arcane.wormholes.shadow.toml')
    dependencies {
        exclude(dependency('com.google.code.gson:gson:.*'))
    }
    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    exclude('META-INF/versions/**', 'module-info.class')
    from('../../LICENSE.md')
    from('../../THIRD-PARTY-NOTICES.md')
    addMultiReleaseAttribute.set(false)
}

tasks.named('jar').configure {
    enabled = false
}

tasks.named('assemble').configure {
    dependsOn(tasks.named('shadowJar'))
}

tasks.named('processResources').configure {
    from('../../src/main/resources/wormholes-pockets-pack') {
        include('data/**')
    }
}

ext.shadowJarType = ShadowJar
apply from: '../game-test.gradle'
apply from: '../../gradle/modded-artifact.gradle'
tasks.named('verifyModdedArtifact').configure {
    metadata.set('META-INF/mods.toml')
}

sourceSets {
    clientGameTest {
        java.srcDir('../modded-common/src/clientGameTest/java')
        java.srcDir('../modded-common/src/clientGameTestDriver/java')
        resources.srcDir('../modded-common/src/clientGameTest/resources')
        resources.srcDir('../modded-common/src/clientGameTestDriver/resources')
        compileClasspath += sourceSets.main.output
        runtimeClasspath = files()
    }
}

configurations {
    clientGameTestImplementation.extendsFrom(implementation)
    clientGameTestCompileOnly.extendsFrom(compileOnly)
}

minecraft {
    runs {
        register('client') {
            workingDir = layout.buildDirectory.dir('run/clientGameTest')
            systemProperty('wormholes.clientgametest', 'true')
            systemProperty('wormholes.clientgametest.server', providers.gradleProperty('clientGameTestServer').getOrElse(''))
            systemProperty('wormholes.clientgametest.serverSeamless', providers.gradleProperty('clientGameTestServerSeamless').getOrElse('true'))
            systemProperty('wormholes.clientgametest.filter', providers.gradleProperty('clientGameTestFilter').getOrElse(''))
        }
    }
}

tasks.named('processClientGameTestResources').configure {
    inputs.property('version', project.version)
    inputs.property('minecraftVersion', minecraftVersion)
    filesMatching('META-INF/mods.toml') {
        expand('version': project.version, 'minecraftVersion': minecraftVersion)
    }
}

TaskProvider<Jar> clientGameTestJar = tasks.register('clientGameTestJar', Jar) {
    group = 'verification'
    archiveFileName.set('Wormholes-ClientGameTest.jar')
    manifest.attributes('MixinConfigs': 'wormholes_clientgametest.mixins.json,wormholes_clientgametest_driver.mixins.json')
    from(sourceSets.clientGameTest.output)
}

TaskProvider<Sync> clientGameTestMods = tasks.register('prepareClientGameTestMods', Sync) {
    from(tasks.named('shadowJar'), clientGameTestJar)
    into(layout.buildDirectory.dir('run/clientGameTest/mods'))
}

tasks.matching { Task task -> task.name == 'runClientGameTestClient' }.configureEach { Task task ->
    dependsOn(clientGameTestMods)
    task.classpath(task.minecraftClasspath)
    doFirst {
        File fmlConfig = file('build/run/clientGameTest/config/fml.toml')
        fmlConfig.parentFile.mkdirs()
        fmlConfig.text = 'earlyWindowControl = false\nversionCheck = false\n'
    }
}

tasks.named('check').configure {
    dependsOn(tasks.named('clientGameTestClasses'))
}
