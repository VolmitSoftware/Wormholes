import org.gradle.api.tasks.TaskProvider
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'com.gradleup.shadow' version '9.5.1'
}

Properties rootProperties = new Properties()
file('../../gradle.properties').withInputStream { InputStream stream -> rootProperties.load(stream) }
String minecraftVersion = providers.gradleProperty('minecraftVersion').getOrElse(rootProperties.getProperty('minecraftVersion'))
String loaderVersion = providers.gradleProperty('fabricLoaderVersion').getOrElse(rootProperties.getProperty('fabricLoaderVersion'))
project(':core') {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('core'))
}
project(':optics') {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('optics'))
}

group = 'art.arcane'
version = providers.gradleProperty('wormholesVersion').getOrElse(rootProperties.getProperty('wormholesVersion'))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java.srcDir('../modded-common/src/main/java')
        resources.srcDir('../modded-common/src/main/resources')
    }
    test {
        java.srcDir('../modded-common/src/test/java')
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://api.modrinth.com/maven') }
    maven { url = uri('https://maven.fabricmc.net/') }
}

configurations {
    irisParserApi {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    bundle {
        canBeConsumed = false
        canBeResolved = true
        exclude(group: 'it.unimi.dsi', module: 'fastutil')
    }
}

configurations {
    nestedApi {
        transitive = false
    }
}

Map<String, String> fabricApi = [
    'fabric-api-base': '2.0.6+fcdff87f5d',
    'fabric-lifecycle-events-v1': '4.1.9+ffef5f675d',
    'fabric-command-api-v2': '3.1.2+fcdff87f5d',
    'fabric-events-interaction-v0': '5.3.6+3434d6d95d',
    'fabric-entity-events-v1': '6.0.4+3434d6d95d',
    'fabric-networking-api-v1': '6.3.8+fcdff87f5d',
    'fabric-resource-loader-v1': '3.0.4+fcdff87f5d',
    'fabric-registry-sync-v0': '8.0.1+fcdff87f5d'
]

TaskProvider<Sync> extractIrisParserApi = tasks.register('extractIrisParserApi', Sync) {
    from({ zipTree(configurations.irisParserApi.singleFile) })
    include('META-INF/jars/glsl-transformer-3.0.0-pre3.jar')
    include('META-INF/jars/antlr4-runtime-4.13.1.jar')
    into(layout.buildDirectory.dir('iris-parser-api'))
}
FileCollection irisParserClasses = files(
    layout.buildDirectory.file('iris-parser-api/META-INF/jars/glsl-transformer-3.0.0-pre3.jar'),
    layout.buildDirectory.file('iris-parser-api/META-INF/jars/antlr4-runtime-4.13.1.jar')).builtBy(extractIrisParserApi)

dependencies {
    irisParserApi('maven.modrinth:iris:vTN4NRGW')
    compileOnly(irisParserClasses)
    testImplementation(irisParserClasses)
    compileOnly('maven.modrinth:iris:vTN4NRGW') { transitive = false }
    compileOnly('maven.modrinth:sodium:v4PSXean') { transitive = false }
    testImplementation('maven.modrinth:iris:vTN4NRGW') { transitive = false }
    testImplementation('maven.modrinth:sodium:v4PSXean') { transitive = false }
    implementation(project(':core'))
    bundle(project(':core'))
    implementation(project(':optics'))
    bundle(project(':optics'))
    implementation('com.github.VolmitSoftware.VolmLib:volmlib-web:master-SNAPSHOT')
    bundle('com.github.VolmitSoftware.VolmLib:volmlib-web:master-SNAPSHOT')
    testImplementation('junit:junit:4.13.2')
    testImplementation('org.mockito:mockito-core:5.23.0')
    minecraft("com.mojang:minecraft:${minecraftVersion}")
    implementation("net.fabricmc:fabric-loader:${loaderVersion}")
    fabricApi.each { String module, String moduleVersion ->
        implementation("net.fabricmc.fabric-api:${module}:${moduleVersion}")
        nestedApi("net.fabricmc.fabric-api:${module}:${moduleVersion}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    options.compilerArgs.add('-parameters')
}

processResources {
    filesMatching('wormholes-build.properties') {
        expand('version': project.version)
    }
    inputs.property('version', project.version)
    inputs.property('minecraftVersion', minecraftVersion)
    filesMatching('fabric.mod.json') {
        expand('version': project.version, 'minecraftVersion': minecraftVersion)
    }
}

tasks.named('shadowJar', ShadowJar).configure {
    archiveFileName.set("Wormholes v${project.version} [Fabric] ${minecraftVersion}+${loaderVersion}.jar")
    configurations = [project.configurations.bundle]
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    relocate('net.kyori', 'art.arcane.wormholes.shadow.kyori')
    relocate('art.arcane.volmlib', 'art.arcane.wormholes.shadow.volmlib')
    relocate('org.yaml.snakeyaml', 'art.arcane.wormholes.shadow.snakeyaml')
    relocate('com.electronwill.nightconfig', 'art.arcane.wormholes.shadow.nightconfig')
    relocate('com.moandjiezana.toml', 'art.arcane.wormholes.shadow.toml')
    dependencies {
        exclude(dependency('com.google.code.gson:gson:.*'))
    }
    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    exclude('META-INF/versions/**', 'module-info.class')
    from('../../LICENSE.md')
    addMultiReleaseAttribute.set(false)
    from(project.configurations.nestedApi) {
        into('META-INF/jars')
        rename { String fileName ->
            String module = fabricApi.keySet().find { String candidate -> fileName.startsWith(candidate + '-') }
            if (module == null) {
                throw new GradleException("Unexpected nested Fabric module ${fileName}")
            }
            return module + '.jar'
        }
    }
}

tasks.named('jar').configure {
    enabled = false
}

tasks.named('assemble').configure {
    dependsOn(tasks.named('shadowJar'))
}

tasks.matching { it.name == 'remapJar' }.configureEach {
    enabled = false
}

tasks.named('processResources').configure {
    from('../../src/main/resources/wormholes-pockets-pack') {
        include('data/**')
    }
}

ext.shadowJarType = ShadowJar
apply from: '../game-test.gradle'
apply from: '../../gradle/modded-artifact.gradle'
tasks.named('verifyModdedArtifact').configure {
    metadata.set('fabric.mod.json')
}

sourceSets {
    clientGameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.gameTest.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.gameTest.output
    }
}

dependencies {
    clientGameTestImplementation('net.fabricmc.fabric-api:fabric-client-gametest-api-v1:6.0.7+4be74c3f5d')
}

project.extensions.getByName('fabricApi').configureTests {
    createSourceSet = false
    enableGameTests = false
    enableClientGameTests = true
    eula = true
}

loom {
    mods {
        wormholes {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
            modFiles.from(provider { project(':core').sourceSets.main.output })
            modFiles.from(provider { project(':optics').sourceSets.main.output })
        }
        wormholes_clientgametest {
            sourceSet(sourceSets.clientGameTest)
        }
    }
    runs {
        clientGameTest {
            source(sourceSets.clientGameTest)
            systemProperties.put('fabric.client.gametest.testModResourcesPath', file('src/clientGameTest/resources').absolutePath)
        }
    }
}

tasks.named('runClientGameTest').configure {
    dependsOn(tasks.named('gameTestClasses'), tasks.named('clientGameTestClasses'))
}

tasks.named('processClientGameTestResources').configure {
    inputs.property('version', project.version)
    inputs.property('minecraftVersion', minecraftVersion)
    filesMatching('fabric.mod.json') {
        expand('version': project.version, 'minecraftVersion': minecraftVersion)
    }
}

tasks.named('check').configure {
    dependsOn(tasks.named('clientGameTestClasses'))
}
