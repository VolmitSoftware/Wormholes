plugins {
    id 'java-library'
    id 'com.gradleup.shadow'
}

group = 'art.arcane'
version = rootProject.version

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        url = uri('https://oss.sonatype.org/content/repositories/snapshots/')
    }
}

dependencies {
    implementation(project(':wormholes-proxy-protocol'))
    compileOnly('com.velocitypowered:velocity-api:3.4.0-SNAPSHOT')
    compileOnly('net.md-5:bungeecord-api:1.21-R0.4-SNAPSHOT')
    testImplementation(libs.junitJupiter)
    testRuntimeOnly(libs.junitPlatformLauncher)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('processResources').configure {
    def pluginProperties = [version: project.version.toString()]
    inputs.properties(pluginProperties)
    filesMatching(['velocity-plugin.json', 'bungee.yml']) {
        expand(pluginProperties)
    }
}

tasks.named('test').configure {
    useJUnitPlatform()
}

tasks.named('jar').configure {
    enabled = false
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    archiveBaseName.set('WormholesProxy')
    archiveClassifier.set('')
}

tasks.named('build').configure {
    dependsOn(tasks.named('shadowJar'))
}
