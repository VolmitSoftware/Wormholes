import groovy.json.JsonSlurper
import org.gradle.api.artifacts.Configuration
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.LibraryElements
import org.gradle.api.attributes.Usage
import org.gradle.api.tasks.ClasspathNormalizer
import org.gradle.api.tasks.PathSensitivity
import org.gradle.jvm.toolchain.JavaLanguageVersion
import org.gradle.jvm.toolchain.JavaLauncher

String minecraftVersion = providers.gradleProperty('minecraftVersion').get()
Properties buildDefaults = new Properties()
file('gradle.properties').withInputStream { InputStream stream -> buildDefaults.load(stream) }
File targetManifest = file("gradle/minecraft-versions/${minecraftVersion}.json")
if (!targetManifest.isFile()) {
    throw new GradleException("Unsupported Minecraft target ${minecraftVersion}")
}
Map<String, Object> minecraftTarget = (Map<String, Object>) new JsonSlurper().parse(targetManifest)
String adapterBuildDirectory = minecraftVersion == buildDefaults.getProperty('minecraftVersion') ? 'build' : "build/${minecraftVersion}"
String bukkitRange = providers.gradleProperty('bukkitMinecraftRange').get()
String wrapper = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'gradlew.bat' : 'gradlew'
File outputDirectory = providers.gradleProperty('pluginOutDirectory')
    .map { String path -> file(path) }
    .getOrElse(file('../PluginOuts'))
Map<String, FileTree> previousArtifacts = ['CraftBukkit', 'Fabric', 'Forge', 'NeoForge'].collectEntries { String platform ->
    [(platform): fileTree(outputDirectory) { include("Wormholes v* [${platform}] *.jar") }]
}
File multiplexorConsumerLocation = new File(rootDir, '../../[Minecraft Server]/consumers').canonicalFile
String consumerLocation = providers.gradleProperty('location')
    .getOrElse(multiplexorConsumerLocation.isDirectory()
        ? multiplexorConsumerLocation.absolutePath
        : layout.buildDirectory.dir('consumers').get().asFile.absolutePath)
String useLocalVolmLib = providers.gradleProperty('useLocalVolmLib').getOrElse('true')
File localVolmLibCheckout = gradle.includedBuilds.find { IncludedBuild included -> included.name == 'VolmLib' }?.projectDir
Configuration moddedSharedLibraries = configurations.create('moddedSharedLibraries') {
    canBeConsumed = false
    canBeResolved = true
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
    }
}
dependencies.add(moddedSharedLibraries.name, 'com.github.VolmitSoftware.VolmLib:volmlib-localization:master-SNAPSHOT')
dependencies.add(moddedSharedLibraries.name, 'com.github.VolmitSoftware.VolmLib:volmlib-web:master-SNAPSHOT')
Provider<JavaLauncher> moddedLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}
Closure<Void> configureModdedInputs = { Task task, String targetVersion, List<String> targetLoaders ->
    task.dependsOn(moddedSharedLibraries)
    task.inputs.files(moddedSharedLibraries).withPropertyName('sharedLibraries').withNormalizer(ClasspathNormalizer)
    task.inputs.files(buildscript.configurations.classpath).withPropertyName('buildPlugins').withNormalizer(ClasspathNormalizer)
    task.inputs.files(fileTree('core/src'), fileTree('optics/src'),
        fileTree('src/main/resources/languages'), fileTree('src/main/resources/wormholes-pockets-pack/data'))
        .withPropertyName('sharedSources').withPathSensitivity(PathSensitivity.RELATIVE)
    task.inputs.files(file('build.gradle'), file('settings.gradle'), file('gradle.properties'),
        file('core/build.gradle'), file('optics/build.gradle'), file('optics/gradle.properties'),
        file('adapters/game-test.gradle'), file('gradle/multiplatform.gradle'),
        file('gradle/modded-target.gradle'), file('gradle/modded-sources.gradle'), file('gradle/modded-artifact.gradle'),
        file('gradle/localization-settings.gradle'), file('gradle/libs.versions.toml'),
        file("gradle/minecraft-versions/${targetVersion}.json"), fileTree('gradle/wrapper'),
        file('gradlew'), file('gradlew.bat'), file('LICENSE.md'), file('THIRD-PARTY-NOTICES.md'))
        .withPropertyName('buildDefinition').withPathSensitivity(PathSensitivity.RELATIVE)
    List<String> sourceRoots = ['adapters/modded-common'] + targetLoaders.collect { String loader -> "adapters/${loader}".toString() }
    if (targetLoaders.contains('neoforge') && !targetLoaders.contains('forge')) {
        sourceRoots.add('adapters/forge')
    }
    for (String sourceRoot : sourceRoots) {
        task.inputs.files(fileTree("${sourceRoot}/src") {
            include('main/**', 'test/**', 'gameTest/**', 'clientGameTest/**', 'clientGameTestDriver/**', "${targetVersion}/**")
        }).withPropertyName(sourceRoot.replace('/', '_')).withPathSensitivity(PathSensitivity.RELATIVE)
        task.inputs.files(file("${sourceRoot}/build.gradle"), file("${sourceRoot}/settings.gradle"), file("${sourceRoot}/gradle.properties"))
            .withPropertyName(sourceRoot.replace('/', '_') + '_build').withPathSensitivity(PathSensitivity.RELATIVE)
    }
    task.inputs.property('useLocalVolmLib', useLocalVolmLib)
    task.inputs.property('minecraftVersion', targetVersion)
    task.inputs.property('wormholesVersion', project.version.toString())
    task.inputs.property('javaRuntime', System.getProperty('java.runtime.version'))
    task.inputs.property('javaVendor', System.getProperty('java.vendor'))
    task.inputs.property('compilerRuntime', moddedLauncher.map { JavaLauncher launcher -> launcher.metadata.javaRuntimeVersion })
    task.inputs.property('compilerVendor', moddedLauncher.map { JavaLauncher launcher -> launcher.metadata.vendor })
    task.inputs.property('gradleVersion', gradle.gradleVersion)
    task.inputs.files(gradle.startParameter.allInitScripts).withPropertyName('initScripts').withPathSensitivity(PathSensitivity.NONE)
    task.outputs.upToDateWhen { !gradle.startParameter.refreshDependencies }
    null
}
List<String> nestedBuildArguments = [gradle.startParameter.buildCacheEnabled ? '--build-cache' : '--no-build-cache']
if (gradle.startParameter.refreshDependencies) {
    nestedBuildArguments.add('--refresh-dependencies')
}
if (gradle.startParameter.rerunTasks) {
    nestedBuildArguments.add('--rerun-tasks')
}
for (File initScript : gradle.startParameter.initScripts) {
    nestedBuildArguments.addAll(['--init-script', initScript.absolutePath])
}
Map<String, File> moddedArtifacts = [:]
tasks.register('buildBukkit', Copy) {
    group = 'distribution'
    dependsOn('check', 'packedJar')
    from(tasks.named('packedJar').flatMap { task -> task.outputJar })
    into(outputDirectory)
    rename { String name -> "Wormholes v${project.version} [CraftBukkit] ${bukkitRange}.jar" }
    doFirst {
        delete(previousArtifacts['CraftBukkit'])
    }
}

Map<String, String> loaders = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge']
Map<String, String> versionKeys = [fabric: 'fabricLoaderVersion', forge: 'forgeVersion', neoforge: 'neoForgeVersion']
loaders.each { String loader, String display ->
    String versionKey = versionKeys[loader]
    String loaderVersion = providers.gradleProperty(versionKey).getOrElse(((Map<String, String>) minecraftTarget['loaders'])[loader])
    String displayVersion = loaderVersion.startsWith("${minecraftVersion}-")
        ? loaderVersion.substring(minecraftVersion.length() + 1)
        : loaderVersion
    if (loader == 'neoforge') {
        displayVersion = displayVersion.replaceFirst(/-beta$/, '')
    }
    String artifactName = "Wormholes v${project.version} [${display}] ${minecraftVersion}+${displayVersion}.jar"
    moddedArtifacts[display] = file("adapters/${loader}/${adapterBuildDirectory}/libs/${artifactName}")
    TaskProvider<Exec> jarTask = tasks.register("${loader}Jar", Exec) {
        group = 'build'
        workingDir(file("adapters/${loader}"))
        commandLine(file(wrapper).absolutePath, ':build', ':core:build', '--console=plain',
            "-PwormholesVersion=${project.version}", "-PminecraftVersion=${minecraftVersion}",
            "-P${versionKey}=${loaderVersion}", "-PuseLocalVolmLib=${useLocalVolmLib}")
        args(nestedBuildArguments)
        args('--project-cache-dir', file("adapters/${loader}/.gradle/targets/${minecraftVersion}").absolutePath)
        if (localVolmLibCheckout != null) {
            environment('ORG_GRADLE_PROJECT_localVolmLibDirectory', localVolmLibCheckout.absolutePath)
        }
        configureModdedInputs(delegate as Task, minecraftVersion, [loader])
        inputs.property('loaderVersion', loaderVersion)
        outputs.file(file("adapters/${loader}/${adapterBuildDirectory}/libs/${artifactName}"))
    }
    TaskProvider<Task> verifyTask = tasks.register("verify${display}Artifact") {
        group = 'verification'
        dependsOn(jarTask)
        inputs.files(jarTask.map { Task task -> task.outputs.files })
    }

    tasks.register("build${display == 'NeoForge' ? 'Neoforge' : display}", Copy) {
        group = 'distribution'
        dependsOn(verifyTask)
        from(jarTask.map { Task task -> task.outputs.files })
        into(outputDirectory)
        doFirst {
            delete(fileTree(outputDirectory) { include("Wormholes v* [${display}] ${minecraftVersion}+*.jar") })
        }
    }
}

tasks.named('fabricJar').configure {
    mustRunAfter('buildBukkit', ':core:build')
}
tasks.named('forgeJar').configure {
    mustRunAfter('fabricJar')
}
tasks.named('neoforgeJar').configure {
    mustRunAfter('forgeJar')
}

tasks.register('buildAllToOut') {
    group = 'distribution'
    dependsOn('buildBukkit', 'buildModdedVersionsToOut')
    doLast {
        logger.lifecycle("Wormholes distributions: ${outputDirectory}")
        previousArtifacts.values().each { FileTree artifacts ->
            artifacts.files.sort { File artifact -> artifact.name }.each { File artifact ->
                logger.lifecycle("  ${artifact.name} (${artifact.length()} bytes)")
            }
        }
    }
}

tasks.register('buildAll') {
    group = 'distribution'
    outputs.upToDateWhen { false }
    dependsOn('buildAllToOut')
    Map<String, List<Object>> consumerDrops = [
        ("${consumerLocation}/plugin-consumers/dropins/plugins".toString()) : ['Wormholes.jar', tasks.named('packedJar').flatMap { task -> task.outputJar }],
        ("${consumerLocation}/fabric-mod-consumers/dropins/mods".toString()) : ['Wormholes-Fabric.jar', moddedArtifacts['Fabric']],
        ("${consumerLocation}/forge-mod-consumers/dropins/mods".toString()) : ['Wormholes-Forge.jar', moddedArtifacts['Forge']],
        ("${consumerLocation}/neoforge-mod-consumers/dropins/mods".toString()) : ['Wormholes-Neoforge.jar', moddedArtifacts['NeoForge']]
    ]
    doLast {
        consumerDrops.each { String consumerPath, List<Object> drop ->
            String keep = (String) drop.get(0)
            delete(consumerDrops.values().collect { List<Object> other -> (String) other.get(0) }
                .findAll { String name -> name != keep }
                .collect { String name -> new File(consumerPath, name) })
            copy {
                from(drop.get(1))
                into(consumerPath)
                rename { String ignored -> keep }
            }
            logger.lifecycle("  ${consumerPath}/${keep}")
        }
    }
}

List<String> minecraftVersions = fileTree('gradle/minecraft-versions') {
    include('*.json')
}.files.collect { File manifest -> manifest.name.substring(0, manifest.name.length() - 5) }.sort()
TaskProvider<Task> previousVersionBuild = null
List<TaskProvider<Task>> versionBuilds = []
minecraftVersions.each { String targetVersion ->
    String taskName = "buildModded${targetVersion.replace('.', '_')}ToOut"
    TaskProvider<Task> versionBuild
    if (targetVersion == minecraftVersion) {
        versionBuild = tasks.register(taskName) {
            group = 'distribution'
            description = "Builds verified ${targetVersion} mod jars into the distribution directory."
            dependsOn('buildFabric', 'buildForge', 'buildNeoforge')
        }
    } else {
        Map<String, Object> target = (Map<String, Object>) new JsonSlurper().parse(file("gradle/minecraft-versions/${targetVersion}.json"))
        versionBuild = tasks.register(taskName, Exec) {
            group = 'distribution'
            description = "Builds verified ${targetVersion} mod jars into the distribution directory."
            mustRunAfter('buildBukkit', ':build', ':core:build', 'fabricJar', 'forgeJar', 'neoforgeJar')
            workingDir(rootDir)
            commandLine(file(wrapper).absolutePath, 'buildFabric', 'buildForge', 'buildNeoforge', '--console=plain',
                "-PwormholesVersion=${project.version}", "-PminecraftVersion=${targetVersion}",
                "-PpluginOutDirectory=${outputDirectory.absolutePath}", "-PuseLocalVolmLib=${useLocalVolmLib}")
            args(nestedBuildArguments)
            args('--project-cache-dir', file(".gradle/modded-targets/${targetVersion}").absolutePath)
            if (localVolmLibCheckout != null) {
                environment('ORG_GRADLE_PROJECT_localVolmLibDirectory', localVolmLibCheckout.absolutePath)
            }
            configureModdedInputs(delegate as Task, targetVersion, loaders.keySet().toList())
            loaders.each { String loader, String display ->
                String loaderVersion = ((Map<String, String>) target['loaders'])[loader]
                String displayVersion = loaderVersion.startsWith("${targetVersion}-")
                    ? loaderVersion.substring(targetVersion.length() + 1) : loaderVersion
                if (loader == 'neoforge') {
                    displayVersion = displayVersion.replaceFirst(/-beta$/, '')
                }
                String artifactName = "Wormholes v${project.version} [${display}] ${targetVersion}+${displayVersion}.jar"
                String targetBuildDirectory = targetVersion == buildDefaults.getProperty('minecraftVersion') ? 'build' : "build/${targetVersion}"
                args("-P${versionKeys[loader]}=${loaderVersion}")
                inputs.property(versionKeys[loader], loaderVersion)
                outputs.files(new File(outputDirectory, artifactName), file("adapters/${loader}/${targetBuildDirectory}/libs/${artifactName}"))
            }
        }
    }
    if (previousVersionBuild != null) {
        TaskProvider<Task> predecessor = previousVersionBuild
        versionBuild.configure { mustRunAfter(predecessor) }
    }
    previousVersionBuild = versionBuild
    versionBuilds.add(versionBuild)
}
tasks.register('buildModdedVersionsToOut') {
    group = 'distribution'
    description = 'Builds every supported Minecraft mod target without deploying jars.'
    dependsOn(versionBuilds)
}
