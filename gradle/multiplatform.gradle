String minecraftVersion = providers.gradleProperty('minecraftVersion').get()
String bukkitRange = providers.gradleProperty('bukkitMinecraftRange').get()
String wrapper = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'gradlew.bat' : 'gradlew'
File outputDirectory = providers.gradleProperty('pluginOutDirectory')
    .map { String path -> file(path) }
    .getOrElse(file('../PluginOuts'))
Map<String, FileTree> previousArtifacts = ['CraftBukkit', 'Fabric', 'Forge', 'NeoForge'].collectEntries { String platform ->
    [(platform): fileTree(outputDirectory) { include("Wormholes v* [${platform}] *.jar") }]
}
File multiplexorConsumerLocation = new File(rootDir, '../../[Minecraft Server]/consumers').canonicalFile
String consumerLocation = providers.gradleProperty('location')
    .getOrElse(multiplexorConsumerLocation.isDirectory()
        ? multiplexorConsumerLocation.absolutePath
        : layout.buildDirectory.dir('consumers').get().asFile.absolutePath)
String useLocalVolmLib = providers.gradleProperty('useLocalVolmLib').getOrElse('true')
File localVolmLibCheckout = gradle.includedBuilds.find { IncludedBuild included -> included.name == 'VolmLib' }?.projectDir
Map<String, File> moddedArtifacts = [:]
List<String> renderHooks = ['net/minecraft/client/renderer/chunk/', 'SectionRenderDispatcher', 'SectionCompiler',
                            'net/minecraft/client/renderer/LevelRenderer', 'RenderRegionCache']
Set<String> portalRenderMixins = ['client.PortalLevelRendererMixin', 'client.PortalProjectionMixin', 'client.PortalLightmapMixin',
                                 'client.MeshLevelExtractorMixin', 'client.MeshEntityRendererMixin', 'client.MeshFeatureWindingMixin',
                                 'client.EndPortalSurfaceMixin', 'client.MeshBlockModelLighterMixin', 'client.MeshFluidLightingMixin',
                                 'client.PortalShaderGameRendererMixin'] as Set

tasks.register('buildBukkit', Copy) {
    group = 'distribution'
    dependsOn('check', 'packedJar')
    from(tasks.named('packedJar').flatMap { task -> task.outputJar })
    into(outputDirectory)
    rename { String name -> "Wormholes v${project.version} [CraftBukkit] ${bukkitRange}.jar" }
    doFirst {
        delete(previousArtifacts['CraftBukkit'])
    }
}

Map<String, String> loaders = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge']
Map<String, String> versionKeys = [fabric: 'fabricLoaderVersion', forge: 'forgeVersion', neoforge: 'neoForgeVersion']
loaders.each { String loader, String display ->
    String versionKey = versionKeys[loader]
    String loaderVersion = providers.gradleProperty(versionKey).get()
    String displayVersion = loaderVersion.startsWith("${minecraftVersion}-")
        ? loaderVersion.substring(minecraftVersion.length() + 1)
        : loaderVersion
    String artifactName = "Wormholes v${project.version} [${display}] ${minecraftVersion}+${displayVersion}.jar"
    moddedArtifacts[display] = file("adapters/${loader}/build/libs/${artifactName}")
    TaskProvider<Exec> jarTask = tasks.register("${loader}Jar", Exec) {
        group = 'build'
        workingDir(file("adapters/${loader}"))
        commandLine(file(wrapper).absolutePath, 'build', '--console=plain',
            "-PwormholesVersion=${project.version}", "-PminecraftVersion=${minecraftVersion}",
            "-P${versionKey}=${loaderVersion}", "-PuseLocalVolmLib=${useLocalVolmLib}")
        if (localVolmLibCheckout != null) {
            environment('ORG_GRADLE_PROJECT_localVolmLibDirectory', localVolmLibCheckout.absolutePath)
        }
        inputs.files(fileTree('core/src'), file('core/build.gradle'), fileTree('adapters/modded-common/src'),
            fileTree("adapters/${loader}/src"), file("adapters/${loader}/build.gradle"),
            file("adapters/${loader}/settings.gradle"), file("adapters/game-test.gradle"), file("adapters/${loader}/gradle.properties"),
            file('gradle.properties'), file('gradle/libs.versions.toml'), file('gradle/localization-settings.gradle'),
            file('.gradle/local.properties'), fileTree('gradle/wrapper'),
            fileTree('src/main/resources/languages'), fileTree('src/main/resources/wormholes-pockets-pack/data'))
        gradle.includedBuilds.find { IncludedBuild included -> new File(included.projectDir, 'localization/build.gradle').isFile() }?.with { IncludedBuild included ->
            inputs.files(fileTree(new File(included.projectDir, 'localization/src')), new File(included.projectDir, 'localization/build.gradle'),
                fileTree(new File(included.projectDir, 'web/src')), new File(included.projectDir, 'web/build.gradle'))
        }
        inputs.property('minecraftVersion', minecraftVersion)
        inputs.property('loaderVersion', loaderVersion)
        inputs.property('wormholesVersion', project.version.toString())
        outputs.file(file("adapters/${loader}/build/libs/${artifactName}"))
    }
    TaskProvider<Task> verifyTask = tasks.register("verify${display}Artifact") {
        group = 'verification'
        dependsOn(jarTask)
        inputs.files(jarTask.map { Task task -> task.outputs.files })
        doLast {
            File artifact = file("adapters/${loader}/build/libs/${artifactName}")
            new java.util.jar.JarFile(artifact).withCloseable { java.util.jar.JarFile archive ->
                String metadata = loader == 'fabric' ? 'fabric.mod.json'
                    : loader == 'forge' ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml'
                for (String required : [metadata, 'art/arcane/wormholes/modded/WormholesModRuntime.class',
                                        'art/arcane/wormholes/network/WireCodec.class',
                                        'art/arcane/wormholes/portal/PortalFrame.class']) {
                    if (archive.getEntry(required) == null) {
                        throw new GradleException("${artifact.name} is missing ${required}")
                    }
                }
                archive.entries().each { java.util.jar.JarEntry entry ->
                    if (entry.name.startsWith('art/arcane/wormholes/')
                        && (entry.name.contains('/gametest/') || entry.name.contains('GameTest')
                            || entry.name.endsWith('/NativeHandoffProbe.class'))) {
                        throw new GradleException("${artifact.name} contains test fixture ${entry.name}")
                    }
                    if (entry.name == 'plugin.yml' || entry.name == 'paper-plugin.yml'
                        || entry.name.startsWith('org/bukkit/') || entry.name.startsWith('io/papermc/')) {
                        throw new GradleException("${artifact.name} contains Bukkit runtime entry ${entry.name}")
                    }
                    if (entry.name.startsWith('art/arcane/volmlib/') || entry.name.startsWith('net/kyori/')) {
                        throw new GradleException("${artifact.name} bundles unrelocated shared library entry ${entry.name}")
                    }
                    if (entry.name.startsWith('art/arcane/wormholes/') && entry.name.endsWith('.class')) {
                        String constants = archive.getInputStream(entry).withCloseable { InputStream stream ->
                            new String(stream.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                        }
                        if (constants.contains('org/bukkit/') || constants.contains('io/papermc/')) {
                            throw new GradleException("${artifact.name} references a Bukkit API in ${entry.name}")
                        }
                        if (constants.contains('art/arcane/volmlib/') || constants.contains('net/kyori/')) {
                            throw new GradleException("${artifact.name} references an unrelocated shared library in ${entry.name}")
                        }
                        for (String renderHook : renderHooks) {
                            if (constants.contains(renderHook)
                                && !entry.name.startsWith('art/arcane/wormholes/modded/client/render/')
                                && !portalRenderMixins.any { String name -> entry.name == "art/arcane/wormholes/modded/mixin/${name.replace('.', '/')}.class" }) {
                                throw new GradleException("${artifact.name} references the render pipeline (${renderHook}) in ${entry.name}")
                            }
                        }
                    }
                }
                java.util.jar.JarEntry mixinConfig = archive.getJarEntry('wormholes.mixins.json')
                if (mixinConfig == null) {
                    throw new GradleException("${artifact.name} is missing wormholes.mixins.json")
                }
                Map<String, Object> mixins = (Map<String, Object>) new groovy.json.JsonSlurper().parse(archive.getInputStream(mixinConfig))
                String mixinPackage = ((String) mixins['package']).replace('.', '/')
                for (String clientMixin : (List<String>) (mixins['client'] ?: [])) {
                    String mixinPath = "${mixinPackage}/${clientMixin.replace('.', '/')}.class"
                    java.util.jar.JarEntry mixinEntry = archive.getJarEntry(mixinPath)
                    if (mixinEntry == null) {
                        throw new GradleException("${artifact.name} is missing client mixin ${mixinPath}")
                    }
                    String mixinConstants = archive.getInputStream(mixinEntry).withCloseable { InputStream stream ->
                        new String(stream.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                    }
                    if (mixinConstants.contains('Lnet/minecraft/client/renderer/') && !portalRenderMixins.contains(clientMixin)) {
                        throw new GradleException("${artifact.name} client mixin ${clientMixin} targets net.minecraft.client.renderer")
                    }
                }
            }
        }
    }
    tasks.register("build${display == 'NeoForge' ? 'Neoforge' : display}", Copy) {
        group = 'distribution'
        dependsOn(verifyTask)
        from(jarTask.map { Task task -> task.outputs.files })
        into(outputDirectory)
        doFirst {
            delete(previousArtifacts[display])
        }
    }
}

tasks.named('fabricJar').configure {
    mustRunAfter('buildBukkit', ':core:build')
}
tasks.named('forgeJar').configure {
    mustRunAfter('fabricJar')
}
tasks.named('neoforgeJar').configure {
    mustRunAfter('forgeJar')
}

tasks.register('buildAllToOut') {
    group = 'distribution'
    dependsOn('buildBukkit', 'buildFabric', 'buildForge', 'buildNeoforge')
    doLast {
        logger.lifecycle("Wormholes distributions: ${outputDirectory}")
        previousArtifacts.values().each { FileTree artifacts ->
            artifacts.files.sort { File artifact -> artifact.name }.each { File artifact ->
                logger.lifecycle("  ${artifact.name} (${artifact.length()} bytes)")
            }
        }
    }
}

tasks.register('buildAll') {
    group = 'distribution'
    outputs.upToDateWhen { false }
    dependsOn('buildAllToOut')
    Map<String, List<Object>> consumerDrops = [
        ("${consumerLocation}/plugin-consumers/dropins/plugins".toString()) : ['Wormholes.jar', tasks.named('packedJar').flatMap { task -> task.outputJar }],
        ("${consumerLocation}/fabric-mod-consumers/dropins/mods".toString()) : ['Wormholes-Fabric.jar', moddedArtifacts['Fabric']],
        ("${consumerLocation}/forge-mod-consumers/dropins/mods".toString()) : ['Wormholes-Forge.jar', moddedArtifacts['Forge']],
        ("${consumerLocation}/neoforge-mod-consumers/dropins/mods".toString()) : ['Wormholes-Neoforge.jar', moddedArtifacts['NeoForge']]
    ]
    doLast {
        consumerDrops.each { String consumerPath, List<Object> drop ->
            String keep = (String) drop.get(0)
            delete(consumerDrops.values().collect { List<Object> other -> (String) other.get(0) }
                .findAll { String name -> name != keep }
                .collect { String name -> new File(consumerPath, name) })
            copy {
                from(drop.get(1))
                into(consumerPath)
                rename { String ignored -> keep }
            }
            logger.lifecycle("  ${consumerPath}/${keep}")
        }
    }
}
