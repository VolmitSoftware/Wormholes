sourceSets {
    runtimeTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('itemExchangeJar', Jar) {
    group = 'verification'
    dependsOn(tasks.named('runtimeTestClasses'))
    archiveFileName.set('Wormholes-ItemExchange.jar')
    from(sourceSets.runtimeTest.output)
}
