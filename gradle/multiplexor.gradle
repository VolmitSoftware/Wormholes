import groovy.json.JsonSlurper
import org.gradle.jvm.tasks.Jar

Properties defaults = new Properties()
file('gradle.properties').withInputStream { InputStream stream -> defaults.load(stream) }
String selectedVersion = providers.gradleProperty('minecraftVersion').get()
Map<String, String> loaderLabels = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge']
Map<String, String> loaderProperties = [fabric: 'fabricLoaderVersion', forge: 'forgeVersion', neoforge: 'neoForgeVersion']
List<File> manifests = fileTree('gradle/minecraft-versions') { include('*.json') }.files.toList().sort()
List<Map<String, Object>> buildTargets = []

project.ext.multiplexor = [
    schema: 1,
    id: 'wormholes',
    name: 'Wormholes',
    sandbox: 'per-target',
    parallelTargets: true,
    sourceDependencies: ['volmlib'],
    targets: buildTargets
]

gradle.projectsEvaluated {
    File bukkitArtifact = tasks.named('packedJar').get().outputJar.get().asFile
    File apiArtifact = tasks.named('apiJar', Jar).get().archiveFile.locationOnly.get().asFile
    List<String> minecraftVersions = manifests.collect { File manifest -> manifest.name.substring(0, manifest.name.length() - 5) }
    buildTargets.addAll([
        [id: 'core', tasks: [':core:check', ':optics:check'], arguments: [], java: 25,
            memoryMiB: 6144, workers: 2, dependsOn: [], artifacts: []],
        [id: 'bukkit', tasks: [':buildBukkit'], arguments: ['-x', ':core:check', '-x', ':optics:check'], java: 25,
            memoryMiB: 6144, workers: 2, dependsOn: ['wormholes:core'], artifacts: [
                [path: relativePath(bukkitArtifact), role: 'runtime', platforms: ['plugin', 'velocity', 'bungee'], minecraftVersions: minecraftVersions]]],
        [id: 'api', tasks: [':apiJar'], arguments: [], java: 25,
            memoryMiB: 6144, workers: 2, dependsOn: [], artifacts: [
                [path: relativePath(apiArtifact), role: 'api', platforms: ['plugin'], minecraftVersions: minecraftVersions]]]
    ])
    for (File manifest : manifests) {
        Map<String, Object> target = (Map<String, Object>) new JsonSlurper().parse(manifest)
        String minecraft = (String) target['minecraft']
        Map<String, String> loaderVersions = (Map<String, String>) target['loaders']
        String outputDirectory = minecraft == defaults.getProperty('minecraftVersion') ? 'build' : "build/${minecraft}"
        loaderLabels.each { String loader, String label ->
            String pin = minecraft == selectedVersion
                ? providers.gradleProperty(loaderProperties[loader]).getOrElse(loaderVersions[loader]) : loaderVersions[loader]
            String displayedPin = pin.startsWith(minecraft + '-') ? pin.substring(minecraft.length() + 1) : pin
            if (loader == 'neoforge') {
                displayedPin = displayedPin.replaceFirst(/-beta$/, '')
            }
            String artifactName = "Wormholes v${project.version} [${label}] ${minecraft}+${displayedPin}.jar"
            buildTargets.add([
                id: "${loader}-${minecraft}".toString(),
                tasks: [':build'],
                arguments: ['-p', "adapters/${loader}".toString(), "-PminecraftVersion=${minecraft}".toString(),
                    "-PwormholesVersion=${project.version}".toString(), "-P${loaderProperties[loader]}=${pin}".toString()],
                java: 25,
                memoryMiB: 6144,
                workers: 2,
                dependsOn: ['wormholes:core'],
                artifacts: [[path: "adapters/${loader}/${outputDirectory}/libs/${artifactName}".toString(),
                    role: 'runtime', platforms: [loader], minecraftVersions: [minecraft]]]
            ])
        }
    }
}
