plugins {
    id 'java-library'
}

Properties wormholesProperties = new Properties()
file('../gradle.properties').withInputStream { InputStream stream -> wormholesProperties.load(stream) }
group = 'art.arcane'
version = providers.gradleProperty('wormholesVersion').getOrElse(wormholesProperties.getProperty('wormholesVersion'))

base {
    archivesName = 'wormholes-core'
}

repositories {
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    api(project(':optics'))
    api('com.github.VolmitSoftware.VolmLib:volmlib-localization:master-SNAPSHOT')
    api('com.github.VolmitSoftware.VolmLib:volmlib-crypto:master-SNAPSHOT')
    implementation('net.kyori:adventure-text-minimessage:4.26.1')
    implementation('net.kyori:adventure-text-serializer-legacy:4.26.1')
    implementation('net.kyori:adventure-text-serializer-plain:4.26.1')
    api('net.kyori:adventure-text-serializer-gson:4.26.1')
    api('it.unimi.dsi:fastutil:8.5.15')
    implementation('com.github.luben:zstd-jni:1.5.7-11')
    implementation('com.electronwill.night-config:toml:3.9.0')
    implementation('org.yaml:snakeyaml:2.7')
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testImplementation('org.mockito:mockito-core:5.23.0')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.10.2')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

String languageSourceRepository = providers.gradleProperty('languageSourceRepository').orElse('VolmitSoftware/Wormholes').get()
String languageSourceBranch = providers.gradleProperty('languageSourceBranch').orElse(providers.provider {
    try {
        Process process = new ProcessBuilder('git', 'symbolic-ref', '--short', 'refs/remotes/origin/HEAD')
            .directory(projectDir)
            .redirectErrorStream(true)
            .start()
        String output = process.inputStream.text.trim()
        if (process.waitFor() == 0 && output.startsWith('origin/')) {
            return output.substring('origin/'.length())
        }
    } catch (IOException | InterruptedException ignored) {
    }
    return 'master'
}).get()
if (!(languageSourceRepository ==~ /[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/)) {
    throw new GradleException('languageSourceRepository must be a GitHub owner/repository')
}
if (!(languageSourceBranch ==~ /[A-Za-z0-9][A-Za-z0-9._\/-]{0,127}/) || languageSourceBranch.contains('..')) {
    throw new GradleException('languageSourceBranch must be a Git branch name')
}
String languageSourcePath = 'src/main/resources/languages'
List<String> languageSourceLocales = fileTree("../${languageSourcePath}") {
    include('*.toml')
}.files.collect { File languageFile ->
    languageFile.name.substring(0, languageFile.name.length() - '.toml'.length())
}.sort()

tasks.register('generateLanguageSourceManifest', WriteProperties) {
    destinationFile.set(layout.buildDirectory.file('generated/language-source/wormholes-language-source.properties'))
    property('repository', languageSourceRepository)
    property('branch', languageSourceBranch)
    property('path', languageSourcePath)
    property('extension', '.toml')
    property('locales', languageSourceLocales.join(','))
}

tasks.register('generateBuildInfo', WriteProperties) {
    destinationFile.set(layout.buildDirectory.file('generated/build-info/wormholes-build.properties'))
    property('version', project.version.toString())
}

tasks.named('processResources').configure {
    from(tasks.named('generateLanguageSourceManifest'))
    from(tasks.named('generateBuildInfo'))
}
